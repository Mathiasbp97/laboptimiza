<!-- CONTEXTO
PRODUCTO: App de finanzas personales white-label, multi-cliente, sin backend.

ARQUITECTURA
- Un único index.html sirve a TODOS los clientes. Cada cliente se identifica por ?c=<slug>.
- La app busca ./clientes/<slug>.json (nombre, color, moneda, vencimiento, activo).
  · Si no existe → pantalla "Licencia no encontrada" (evita que alguien invente su propio link).
  · Si activo=false → "Licencia suspendida".  · Si vence < hoy → banner + solo lectura de export.
- Sin ?c → MODO DEMO con datos ficticios (para reels, pauta y prueba gratis).
- Si se abre como archivo (file://) y CONFIG.cliente.nombre tiene valor → modo "licencia local"
  (plan Básico: le entregás el archivo con su nombre ya puesto).
- Datos: localStorage, clave separada por cliente: "fin.<slug>". Nada sale del dispositivo.
- Librerías CDN: Chart.js (al inicio), SheetJS y jsPDF+autoTable (se cargan recién al exportar).

LÓGICA DE NEGOCIO (auditable)
- Saldo cuenta = saldo inicial + ingresos − gastos pagados con la cuenta − pagos de tarjeta
                 ± transferencias − aportes a metas + retiros de metas.
- Deuda tarjeta = deuda inicial + gastos con tarjeta (neto de reintegro) − pagos.
  Un gasto con tarjeta NO baja la caja hasta que se registra el pago.
- Reintegro: neto = monto × (1 − %/100).
- Gastos fijos con arrastre: por cada mes desde "desde": debido = monto + arrastre;
  arrastre = max(0, debido − pagado del mes). Pendiente actual = debido − pagado.
- Metas: interés compuesto diario: saldo × (1 + TNA/365)^días entre movimientos.
- Simulador de deudas: interés = saldo × tasa mensual; pago se aplica luego del interés.
- Fondo mutuo: capitalización diaria (1+r/365)^(365/12) o mensual (1+r/12) por mes, aporte a fin de mes.
- CDA: interés simple = capital × TNA × meses/12, pagado según frecuencia.
- Bono: cupón = nominal × tasa × meses del período/12; TIR por bisección sobre el precio de compra.

CÓMO EXTENDER
- Nueva sección: agregar entrada en VIEWS + función render<Nombre>() + botón en nav o en "Más".
- Nuevo campo en movimientos: agregarlo en formMov() y en normMov().
- Supabase (multi-dispositivo, plan Pro): reemplazar Store.load/save por llamadas a una tabla
  "finanzas" (id = slug, data jsonb) con RLS por usuario.
-->
<style>

  --bg:#0F1115; --bg2:#16181D; --bg3:#1D2027; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --tx:#E8EAED; --tx2:#9AA0AA; --tx3:#6B717C;
  --ac:#3B82F6; --ac-soft:rgba(59,130,246,.14);
  --ok:#10B981; --warn:#F59E0B; --bad:#EF4444;
  --r:14px; --nav:68px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.45}
body{min-height:100vh;padding-bottom:calc(var(--nav) + var(--safe-b) + 16px)}
button,input,select,textarea{font:inherit;color:inherit}
.num,.n{font-variant-numeric:tabular-nums}
a{color:var(--ac)}
/* layout */
.app{max-width:1120px;margin:0 auto;padding:calc(var(--safe-t) + 16px) 16px 0}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.logo{width:38px;height:38px;border-radius:11px;background:var(--ac);display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff;flex-shrink:0;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.top h1{font-size:18px;font-weight:700;letter-spacing:-.01em}
.top .sub{font-size:12.5px;color:var(--tx2)}
.top .grow{flex:1;min-width:0}
.icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--bg2);display:grid;place-items:center;cursor:pointer;transition:.15s}
.icon-btn:hover{border-color:var(--line2);background:var(--bg3)}
.icon-btn svg{width:18px;height:18px}
.banner{border:1px solid var(--line);background:var(--ac-soft);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:14px;display:flex;gap:10px;align-items:center}
.banner.warn{background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.3)}
.banner b{font-weight:600}
.banner .grow{flex:1}
/* cards */
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.card+.card{margin-top:12px}
.card h3{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 .grow{flex:1}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.sec{margin-top:12px}
.hero{background:linear-gradient(180deg,var(--ac-soft),transparent 80%),var(--bg2)}
.hero .lbl{font-size:12px;color:var(--tx2);text-transform:uppercase;letter-spacing:.06em;font-weight:500;display:flex;align-items:center;gap:6px}
.hero .big{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:4px 0 2px}
.hero .formula{font-size:12px;color:var(--tx3)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;margin-top:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;font-size:12.5px;cursor:pointer;transition:.15s;text-align:left}
.chip:hover{border-color:var(--line2)}
.chip b{display:block;font-size:14px;font-weight:600;margin-top:2px}
.kpi{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi .l{font-size:12px;color:var(--tx2);display:flex;align-items:center;gap:6px}
.kpi .v{font-size:19px;font-weight:700;margin-top:4px;letter-spacing:-.01em}
.kpi .d{font-size:11.5px;color:var(--tx3);margin-top:2px}
.ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)} .mut{color:var(--tx2)} .mut3{color:var(--tx3)}
/* tooltip */
.tip{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;border:1px solid var(--line2);font-size:10px;color:var(--tx2);cursor:help;position:relative;flex-shrink:0;text-transform:none;letter-spacing:0;font-weight:600}
.tip:hover::after,.tip:focus::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);width:230px;background:#000;border:1px solid var(--line2);color:var(--tx);font-size:12px;font-weight:400;line-height:1.4;padding:8px 10px;border-radius:8px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.5);pointer-events:none}
/* list rows */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer;transition:.15s}
.row:last-child{border-bottom:0}
.row:hover{background:rgba(255,255,255,.02)}
.row .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:700;flex-shrink:0;background:var(--bg3)}
.row .ic.in{background:rgba(16,185,129,.14);color:var(--ok)}
.row .ic.out{background:rgba(239,68,68,.12);color:var(--bad)}
.row .ic.pay{background:var(--ac-soft);color:var(--ac)}
.row .ic.tr{background:rgba(255,255,255,.06);color:var(--tx2)}
.row .ic svg{width:17px;height:17px}
.row .mid{flex:1;min-width:0}
.row .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-weight:600;text-align:right;white-space:nowrap}
.row .amt small{display:block;font-size:11px;font-weight:400;color:var(--tx3)}
.empty{text-align:center;padding:28px 12px;color:var(--tx2);font-size:13.5px}
.empty b{display:block;color:var(--tx);font-size:15px;margin-bottom:4px}
.empty .btn{margin-top:12px}
/* bars */
.bar{height:7px;background:var(--bg3);border-radius:99px;overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--ac);transition:width .4s}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--bg3);color:var(--tx2);white-space:nowrap}
.pill.ok{background:rgba(16,185,129,.14);color:var(--ok)}
.pill.warn{background:rgba(245,158,11,.14);color:var(--warn)}
.pill.bad{background:rgba(239,68,68,.14);color:var(--bad)}
.alert{display:flex;gap:10px;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-size:13px;align-items:flex-start}
.alert+.alert{margin-top:8px}
.alert .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0}
/* buttons & forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--bg3);font-weight:600;font-size:14px;cursor:pointer;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--line2);filter:brightness(1.1)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--ac);border-color:transparent;color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{height:32px;padding:0 11px;font-size:13px;border-radius:9px}
.btn.block{width:100%}
.btn svg{width:16px;height:16px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
label.f{display:block;margin-bottom:12px}
label.f>span{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--tx2);margin-bottom:6px;font-weight:500}
.in,select.in,textarea.in{width:100%;height:44px;border-radius:10px;border:1px solid var(--line2);background:var(--bg);padding:0 12px;font-size:15px;outline:none;transition:.15s}
textarea.in{height:70px;padding:10px 12px;resize:vertical}
.in:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-soft)}
.in.big{height:56px;font-size:24px;font-weight:700}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1;height:34px;border:0;background:transparent;border-radius:8px;font-size:13px;font-weight:600;color:var(--tx2);cursor:pointer;transition:.15s;white-space:nowrap;padding:0 10px}
.seg button.on{background:var(--bg3);color:var(--tx);box-shadow:0 1px 2px rgba(0,0,0,.3)}
.seg.t-gasto button.on{background:rgba(239,68,68,.16);color:#fca5a5}
.seg.t-ingreso button.on{background:rgba(16,185,129,.16);color:#6ee7b7}
.filters{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:12px}
.filters .r{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.filters .in{height:38px;font-size:13.5px}
.res{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
.res .l{font-size:12px;color:var(--tx2)} .res .v{font-size:18px;font-weight:700;margin-top:2px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;color:var(--tx2);font-weight:500;font-size:12px;padding:8px 6px;border-bottom:1px solid var(--line)}
table.t td{padding:8px 6px;border-bottom:1px solid var(--line)}
table.t td.r,table.t th.r{text-align:right}
.tbl-wrap{overflow-x:auto;max-height:340px;overflow-y:auto}
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.menu .m{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;transition:.15s;text-align:left}
.menu .m:hover{border-color:var(--line2);transform:translateY(-1px)}
.menu .m .mi{width:36px;height:36px;border-radius:10px;background:var(--ac-soft);color:var(--ac);display:grid;place-items:center;margin-bottom:10px}
.menu .m .mi svg{width:18px;height:18px}
.menu .m b{display:block;font-size:14.5px}
.menu .m span{font-size:12px;color:var(--tx2)}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--tx2);font-size:13.5px;cursor:pointer;margin-bottom:12px;background:none;border:0}
.back:hover{color:var(--tx)}
.chart-box{position:relative;height:220px}
.chart-box.sm{height:190px}
/* nav */
nav.bn{position:fixed;left:0;right:0;bottom:0;height:calc(var(--nav) + var(--safe-b));padding-bottom:var(--safe-b);background:rgba(15,17,21,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;z-index:20}
nav.bn button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:500;color:var(--tx3);cursor:pointer;transition:.15s}
nav.bn button svg{width:21px;height:21px}
nav.bn button.on{color:var(--ac)}
.fab{position:fixed;right:18px;bottom:calc(var(--nav) + var(--safe-b) + 16px);width:56px;height:56px;border-radius:18px;background:var(--ac);color:#fff;border:0;display:grid;place-items:center;box-shadow:0 10px 28px rgba(0,0,0,.45);cursor:pointer;z-index:21;transition:.15s}
.fab:hover{transform:translateY(-2px)}
.fab svg{width:24px;height:24px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);z-index:40;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .18s}
.ov.on{opacity:1;pointer-events:auto}
.sheet{background:var(--bg2);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;padding:18px 18px calc(18px + var(--safe-b));transform:translateY(24px);transition:transform .2s}
.ov.on .sheet{transform:none}
.sheet .hd{display:flex;align-items:center;margin-bottom:14px}
.sheet .hd h2{font-size:17px;font-weight:700;flex:1}
.sheet .ft{display:flex;gap:8px;margin-top:6px;position:sticky;bottom:-18px;background:var(--bg2);padding:10px 0 0}
.sheet .ft .btn{flex:1}
/* toast */
#toasts{position:fixed;top:calc(var(--safe-t) + 14px);left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;width:max-content;max-width:92vw}
.toast{background:#000;border:1px solid var(--line2);padding:10px 14px;border-radius:11px;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:tin .2s ease;display:flex;gap:8px;align-items:center}
.toast.ok::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.toast.err::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--bad)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
/* lock */
.lock{position:fixed;inset:0;background:var(--bg);z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.lock h2{font-size:20px;font-weight:700;margin-top:14px}
.lock p{color:var(--tx2);font-size:13.5px;margin-top:4px;text-align:center}
.dots{display:flex;gap:14px;margin:26px 0}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line2);transition:.15s}
.dots i.f{background:var(--ac);border-color:var(--ac)}
.dots.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.pad button{height:72px;border-radius:50%;border:1px solid var(--line);background:var(--bg2);font-size:24px;font-weight:600;cursor:pointer;transition:.12s}
.pad button:active{background:var(--bg3);transform:scale(.95)}
.pad button.ghost{border:0;background:none;font-size:14px;color:var(--tx2)}
/* skeleton */
.sk{background:linear-gradient(90deg,var(--bg2),var(--bg3),var(--bg2));background-size:200% 100%;animation:skl 1.2s infinite;border-radius:var(--r)}
@keyframes skl{to{background-position:-200% 0}}
.hide{display:none!important}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.flex{display:flex;align-items:center;gap:8px}.sp{justify-content:space-between}
.small{font-size:12.5px}
/* desktop */
@media(min-width:900px){
  body{padding-bottom:24px;padding-left:220px}
  nav.bn{top:0;bottom:0;right:auto;width:220px;height:auto;flex-direction:column;justify-content:flex-start;padding:84px 12px 12px;border-top:0;border-right:1px solid var(--line);gap:4px}
  nav.bn button{flex:0;flex-direction:row;justify-content:flex-start;height:42px;padding:0 14px;border-radius:10px;font-size:14px;gap:12px}
  nav.bn button.on{background:var(--ac-soft)}
  .fab{bottom:28px;right:28px}
  .ov{align-items:center}
  .sheet{border-radius:20px}
  .desk2{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;align-items:start}
  .desk2>.card{margin-top:0!important}
  .menu{grid-template-columns:repeat(3,1fr)}
  .chart-box{height:260px}
}
@media(max-width:560px){
  .g4{grid-template-columns:repeat(2,1fr)}
  .g3{grid-template-columns:1fr 1fr}
  .hero .big{font-size:30px}
}

/* tutorial guiado */
#tour{position:fixed;inset:0;z-index:70;display:none}
#tour.on{display:block}
#tour .blk{position:fixed;inset:0}
#tour .hole{position:fixed;border-radius:14px;box-shadow:0 0 0 200vmax rgba(0,0,0,.74);outline:2px solid var(--ac);outline-offset:2px;transition:all .28s ease;pointer-events:none}
#tour .hole.none{outline:0;width:0!important;height:0!important;left:50%!important;top:40%!important}
#tour .tcard{position:fixed;background:var(--bg2);border:1px solid var(--line2);border-radius:16px;padding:16px 16px 14px;width:min(330px,calc(100vw - 24px));box-shadow:0 20px 50px rgba(0,0,0,.6);transition:top .28s ease,left .28s ease;animation:tin .25s ease}
#tour .tcard .stp{font-size:11px;color:var(--ac);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
#tour .tcard h4{font-size:17px;font-weight:700;margin:4px 0 6px;letter-spacing:-.01em}
#tour .tcard p{font-size:13.5px;color:var(--tx2);line-height:1.5}
#tour .prog{display:flex;gap:4px;margin-top:12px}

#tour .act{display:flex;gap:8px;margin-top:12px;align-items:center}
#tour .act .sk2{margin-right:auto;background:none;border:0;color:var(--tx3);font-size:13px;cursor:pointer;padding:6px 0}
.fab.tour-top{z-index:75!important;animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 var(--ac-soft),0 10px 28px rgba(0,0,0,.45)}50%{box-shadow:0 0 0 14px rgba(59,130,246,0),0 10px 28px rgba(0,0,0,.45)}}
@media print{
  nav.bn,.fab,.icon-btn,.btn,.banner,#toasts,.filters{display:none!important}
  body{background:#fff;color:#000;padding:0}
  .card,.kpi{background:#fff;border:1px solid #ccc;box-shadow:none;break-inside:avoid}
  .mut,.mut3,.kpi .l{color:#555}

<body>
<div id="toasts"></div>
<div id="tour"><div class="blk"></div><div class="hole"></div><div class="tcard"></div></div>
<div id="lock" class="lock hide"></div>
<div class="app" id="app">
  <div class="sk" style="height:60px"></div>
  <div class="sk mt12" style="height:150px"></div>
  <div class="grid g2 mt12"><div class="sk" style="height:80px"></div><div class="sk" style="height:80px"></div></div>
</div>
<nav class="bn hide" id="nav"></nav>
<button class="fab hide" id="fab" onclick="openMov()" aria-label="Nuevo movimiento"></button>
<div class="ov" id="ov" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
/* ═══════════════ CONFIG (lo único que cambia el comprador / revendedor) ═══════════════ */
const CONFIG = {

/* ═══════════════ Motor de cálculo ═══════════════ */
const neto = m => round(m.monto * (1 - (Number(m.reintegro)||0)/100));
const metaMovsCuenta = () => S.metas.flatMap(me => me.movs.filter(x=>x.cuentaId).map(x=>({...x,meta:me.nombre})));
function saldoCuenta(id){
  let s = Number(S.cuentas.find(c=>c.id===id)?.saldoInicial)||0;
  for(const m of S.movs){
    if(m.tipo==='ingreso' && m.cuentaId===id) s += m.monto;
    else if(m.tipo==='gasto' && m.medio!=='tarjeta' && m.cuentaId===id) s -= neto(m);
    else if(m.tipo==='pago' && m.cuentaId===id) s -= m.monto;
    else if(m.tipo==='transf'){ if(m.cuentaId===id) s -= m.monto; if(m.cuentaDestino===id) s += m.monto; }
  }
  for(const x of metaMovsCuenta()) if(x.cuentaId===id){ if(x.tipo==='aporte') s -= x.monto; else if(x.tipo==='retiro') s += x.monto; }
  return round(s);
}
const saldoTotal = () => sum(S.cuentas, c=>saldoCuenta(c.id));
function deudaTarjeta(id){
  let s = Number(S.tarjetas.find(t=>t.id===id)?.deudaInicial)||0;
  for(const m of S.movs){
    if(m.tipo==='gasto' && m.medio==='tarjeta' && m.tarjetaId===id) s += neto(m);
    else if(m.tipo==='pago' && m.tarjetaId===id) s -= m.monto;
  }
  return round(s);
}
const deudaTarjetas = () => sum(S.tarjetas, t=>deudaTarjeta(t.id));
const movsMes = m => S.movs.filter(x=>ym(x.fecha)===m);
const ingresosMes = m => sum(movsMes(m).filter(x=>x.tipo==='ingreso'), x=>x.monto);
const gastosMes = (m, f=()=>true) => sum(movsMes(m).filter(x=>x.tipo==='gasto' && f(x)), neto);
function estadoFijo(f, mes){
  // arrastre mes a mes desde f.desde hasta mes-1 (fórmula en CONTEXTO)
  const desde = f.desde || mes; let carry = 0;
  const pagado = m => sum(S.movs.filter(x=>x.tipo==='gasto' && x.fijoId===f.id && ym(x.fecha)===m), neto);
  for(let m = desde; m < mes; m = addM(m,1)){ const due = f.monto + carry; carry = Math.max(0, due - pagado(m)); }
  const due = mes >= desde ? f.monto + carry : 0; const pag = pagado(mes);
  return { arrastre: carry, debido: due, pagado: pag, pendiente: Math.max(0, round(due - pag)) };
}
const fijosTotal = () => sum(S.fijos, f=>f.monto);
const fijosPendientes = (m=ym(hoy())) => sum(S.fijos, f=>estadoFijo(f,m).pendiente);
function metaEstado(me, hasta=hoy()){
  const r = (Number(me.tasa)||0)/100; const ev = [...me.movs].sort((a,b)=>a.fecha.localeCompare(b.fecha));
  let bal = 0, last = null, aport = 0, ret = 0, gas = 0;
  for(const e of ev){ if(e.fecha > hasta) break;
    if(last) bal *= Math.pow(1 + r/365, Math.max(0,days(last,e.fecha)));
    if(e.tipo==='aporte'){ bal += e.monto; aport += e.monto; } else if(e.tipo==='retiro'){ bal -= e.monto; ret += e.monto; } else { bal -= e.monto; gas += e.monto; }
    last = e.fecha; }
  if(last) bal *= Math.pow(1 + r/365, Math.max(0,days(last,hasta)));
  return { saldo: round(bal), aportado: aport, retirado: ret, gastado: gas, interes: round(bal - (aport - ret - gas)) };
}
const metasTotal = () => sum(S.metas, m=>metaEstado(m).saldo);
function proyMeta(me, meses=24){
  const r = (Number(me.tasa)||0)/100, f = Math.pow(1+r/365, 365/12); let b = metaEstado(me).saldo; const out = [b];
  for(let i=1;i<=meses;i++){ b = b*f + (Number(me.aporteMensual)||0); out.push(round(b)); } return out;
}
function promedio3(fn){ // promedio de los últimos 3 meses CERRADOS con datos
  const M = ym(hoy()); const vals = [];
  for(let k=1;k<=3;k++){ const m = addM(M,-k); if(movsMes(m).length) vals.push(fn(m)); }
  return vals.length ? sum(vals)/vals.length : fn(M);
}
function simDeuda(saldo, tm, pago){
  const r = tm/100; let s = saldo, mes = 0, int = 0; const serie = [round(s)];
  if(saldo<=0) return {meses:0,interes:0,serie,ok:true};
  if(pago <= s*r) return {meses:Infinity,interes:Infinity,serie,ok:false};
  while(s > 0.5 && mes < 600){ const i = s*r; int += i; s = s + i - pago; if(s<0) s = 0; mes++; serie.push(round(s)); }
  return { meses: mes, interes: round(int), serie, ok: mes < 600 };
}

function alertas(){
  const M = ym(hoy()), out = [];
  const pend = S.fijos.map(f=>({f,e:estadoFijo(f,M)})).filter(x=>x.e.pendiente>0);
  if(pend.length) out.push(['warn', `${pend.length} gasto${pend.length>1?'s':''} fijo${pend.length>1?'s':''} pendiente${pend.length>1?'s':''}: ${fmt(sum(pend,x=>x.e.pendiente))}`, `go('presup')`]);
  const arr = pend.filter(x=>x.e.arrastre>0); if(arr.length) out.push(['bad', `Arrastrás deuda de meses anteriores en: ${arr.map(x=>esc(x.f.nombre)).join(', ')}`, `go('presup')`]);
  for(const [cat,lim] of Object.entries(S.limites)){ const g = gastosMes(M,x=>x.cat===cat); if(lim>0 && g>lim) out.push(['bad', `Superaste el límite de ${esc(cat)} por ${fmt(g-lim)}`, `UI.sub.presup='limites';go('presup')`]); }
  for(const t of S.tarjetas){ const d = deudaTarjeta(t.id); if(t.limite>0 && d/t.limite>0.3) out.push([d/t.limite>0.7?'bad':'warn', `${esc(t.nombre)} usa el ${pct(d/t.limite*100,0)} del límite. Lo sano es menos del 30%.`, `go('tarjetas')`]); }
  const caja = saldoTotal(), col = Number(S.ajustes.colchon)||0, fp = fijosPendientes(M);
  if(col>0 && fp===0 && caja>col) out.push(['ok', `Tenés ${fmt(caja-col)} por encima de tu colchón y los fijos están pagos. Buen momento para aportar a una meta o invertir.`, `go('mas','metas')`]);
  if(col>0 && caja<col) out.push(['warn', `Tu caja está ${fmt(col-caja)} por debajo del colchón mínimo.`, `go('mas','ajustes')`]);
  return out;
}

function rowMov(m){
  const map = { ingreso:['in','down','+'], gasto:['out','up','−'], pago:['pay','card','−'], transf:['tr','swap',''] };
  const [cls,i,sg] = map[m.tipo] || map.gasto;
  let s = fDate(m.fecha) + ' · ';
  if(m.tipo==='gasto') s += esc(m.cat||'') + ' · ' + (m.medio==='tarjeta' ? esc(nomTarjeta(m.tarjetaId)) : esc(nomCuenta(m.cuentaId)));
  if(m.tipo==='ingreso') s += esc(m.fuente||'') + ' · ' + esc(nomCuenta(m.cuentaId));
  if(m.tipo==='pago') s += 'Pago a ' + esc(nomTarjeta(m.tarjetaId));
  if(m.tipo==='transf') s += esc(nomCuenta(m.cuentaId)) + ' → ' + esc(nomCuenta(m.cuentaDestino));

}

function calcNeto(){ const el = $('#mNeto'); if(!el) return; const m = parseNum(val('mMonto')), r = parsePct(val('mReint')); el.textContent = r>0 ? `Neto registrado: ${fmt(m*(1-r/100))} (te ahorrás ${fmt(m*r/100)})` : ''; }

  const m = { id: id||uid(), tipo: MT, monto, desc: val('mDesc').trim(), fecha: val('mFecha')||hoy(), nota: val('mNota').trim() };
  if(MT==='gasto'){ Object.assign(m,{ reintegro: Math.min(100,Math.max(0,parsePct(val('mReint')))), cat: val('mCat'), fijoId: val('mFijo'), medio: val('mMedio') });

function vLimites(){
  const M = ym(hoy()), [y,mo] = M.split('-').map(Number), dm = new Date(y,mo,0).getDate(), dHoy = +hoy().slice(8,10);
  const cats = Object.entries(S.limites).filter(([,v])=>v>0);
  const rows = cats.map(([c,lim])=>{ const g = gastosMes(M,x=>x.cat===c), u = g/lim*100, proy = g/dHoy*dm; return {c,lim,g,u,proy}; }).sort((a,b)=>b.u-a.u);
  const rec = [];
  rows.forEach(r=>{ if(r.g>r.lim) rec.push(['bad',`<b>${esc(r.c)}</b>: superaste el techo por ${fmt(r.g-r.lim)}. Evitá más gastos acá hasta fin de mes o subí el techo si es real.`]);
    else if(r.proy>r.lim*1.05) rec.push(['warn',`<b>${esc(r.c)}</b>: a este ritmo terminás el mes en ${fmt(r.proy)} (techo ${fmt(r.lim)}). Te quedan ${fmt((r.lim-r.g)/Math.max(1,dm-dHoy))} por día.`]); });
  const sinLim = S.ajustes.categorias.filter(c=>c!=='Fijos' && !S.limites[c] && gastosMes(M,x=>x.cat===c)>0);
  if(sinLim.length) rec.push(['warn',`Gastás en ${sinLim.map(esc).join(', ')} sin techo definido.`]);
  if(!rec.length && rows.length) rec.push(['ok','Vas dentro de todos tus techos. Si te sobra a fin de mes, mandalo a una meta de ahorro.']);
  return `<div class="desk2"><div class="card"><h3><span class="grow">Techos variables · ${mLong(M)} ${tip('Montos máximos que te permitís gastar por categoría en el mes. La proyección estima cómo cerrás el mes al ritmo actual: gastado ÷ días transcurridos × días del mes.')}</span><button class="btn sm" onclick="editLimites()">Editar</button></h3>
    ${rows.length ? rows.map(r=>{ const cl = r.u>100?'bad':r.u>80?'warn':'ok';
      return `<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div class="flex sp"><b style="font-weight:600">${esc(r.c)}</b><span class="num small"><b>${fmt(r.g)}</b> <span class="mut">/ ${fmt(r.lim)}</span></span></div>
      <div class="bar"><i style="width:${Math.min(100,r.u)}%;background:var(--${cl})"></i></div>
      <div class="flex sp small mt8"><span class="pill ${cl}">${pct(r.u,0)}</span><span class="mut3">Proyección cierre: <span class="num ${r.proy>r.lim?'warn':''}">${fmt(r.proy)}</span></span></div></div>`; }).join('')
    : `<div class="empty"><b>Sin techos definidos</b>Poné un máximo por categoría y la app te avisa antes de pasarte.<br><button class="btn pri" onclick="editLimites()">Definir techos</button></div>`}</div>
  <div><div class="card"><h3>Gastos por categoría este mes</h3><div class="chart-box sm"><canvas id="chCat"></canvas></div></div>
  <div class="card"><h3>Recomendaciones</h3>${rec.map(([t,m])=>`<div class="alert"><span class="dot" style="background:var(--${t})"></span><div>${m}</div></div>`).join('')||'<div class="empty">Cargá gastos para ver recomendaciones.</div>'}</div></div></div>`;
}

function presetsDeuda(){ return [...S.tarjetas.map(t=>['t:'+t.id, t.nombre, deudaTarjeta(t.id), t.tasa||0, Math.round(deudaTarjeta(t.id)*0.1)]),

  return `<div class="card"><h3>Simulador de deudas ${tip('Cada mes: interés = saldo × tasa mensual; luego se descuenta tu pago. Si el pago no cubre el interés, la deuda nunca baja.')}</h3>
    <label class="f"><span>Deuda</span><select id="dSel" class="in" onchange="UI.deudaSel=this.value;render()">${optList(ps.map(x=>[x[0],x[1]]),sel)}</select></label>

}
function afterDeudas(){
  const s = parseNum(val('dSal')), t = parsePct(val('dTas')), mi = parseNum(val('dMin')), ex = parseNum(val('dExt'));
  const a = simDeuda(s,t,mi), b = simDeuda(s,t,mi+ex); const mm = n => n===Infinity ? 'Nunca' : n>=12 ? `${Math.floor(n/12)} a ${n%12} m` : `${n} meses`;

  mkChart('chDeu',{type:'line',data:{labels:L,datasets:[{label:'Mínimo',data:a.serie.slice(0,n),borderColor:'#EF4444',pointRadius:0,tension:.2},{label:'Con extra',data:b.serie.slice(0,n),borderColor:'#10B981',pointRadius:0,tension:.2}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}},scales:{y:{beginAtZero:true,ticks:{callback:v=>fmtK(v)}},x:{grid:{display:false},ticks:{maxTicksLimit:10}}}}});
}

/* Inversiones */
function vInv(){
  const s = UI.sub.inv;
  const seg = `<div class="seg" style="margin-bottom:12px">${[['fondo','Fondo mutuo'],['cda','CDA / Plazo fijo'],['bono','Bono / Título']].map(([k,l])=>`<button class="${s===k?'on':''}" onclick="UI.sub.inv='${k}';render()">${l}</button>`).join('')}</div>`;
  const F = (id,l,v,t='',pc=false) => `<label class="f"><span>${l} ${t?tip(t):''}</span><input id="${id}" class="in num" inputmode="${pc?'decimal':'numeric'}" value="${v}" oninput="${pc?'':'moneyInput(this);'}afterInv()"></label>`;
  const S2 = (id,l,o) => `<label class="f"><span>${l}</span><select id="${id}" class="in" onchange="afterInv()">${o}</select></label>`;
  let body = '';
  if(s==='fondo') body = `<div class="grid g2">${F('iIni','Saldo inicial',fmtN(5000000))}${F('iApo','Aporte mensual',fmtN(500000))}${F('iTas','Tasa anual estimada %','7','Rendimiento anual esperado del fondo. No está garantizado.',true)}${F('iMes','Horizonte (meses)','36','',true)}</div>${S2('iCap','Capitalización','<option value="d">Diaria</option><option value="m">Mensual</option>')}`;
  if(s==='cda') body = `<div class="grid g2">${F('iCap2','Capital',fmtN(20000000))}${F('iTas','Tasa anual %','8,5','TNA pactada con el banco. Interés simple sobre el capital.',true)}${F('iMes','Plazo (meses)','12','',true)}${S2('iPag','Pago de intereses','<option value="0">Al vencimiento</option><option value="1">Mensual</option><option value="3">Trimestral</option>')}</div>`;
  if(s==='bono') body = `<div class="grid g2">${F('iNom','Valor nominal',fmtN(10000000))}${F('iTas','Cupón anual %','9','Tasa que paga el bono sobre el valor nominal.',true)}${F('iMes','Plazo total (meses)','36','',true)}${S2('iFre','Pago de cupones','<option value="1">Mensual</option><option value="3">Trimestral</option><option value="6" selected>Semestral</option><option value="0">Al vencimiento</option>')}
    ${F('iPre','Precio de compra (opcional)','','Si comprás por debajo o encima del nominal, la app calcula tu TIR real (rendimiento al vencimiento).')}</div>`;
  return seg + `<div class="card">${body}<div id="iRes"></div></div><div class="card sec"><h3 id="iTit">Evolución</h3><div class="chart-box sm"><canvas id="chInv"></canvas></div></div><div class="card sec"><h3>Detalle</h3><div class="tbl-wrap" id="iTbl"></div></div>`;
}
function afterInv(){
  const s = UI.sub.inv, M = ym(hoy()); const r = parsePct(val('iTas'))/100, n = Math.max(1,Math.min(600,Math.round(parsePct(val('iMes')))));
  let res = '', serie = [], rows = [], lab = [];
  if(s==='fondo'){
    const ini = parseNum(val('iIni')), apo = parseNum(val('iApo')), f = val('iCap')==='d' ? Math.pow(1+r/365,365/12) : 1+r/12; let b = ini; serie=[b]; lab=['Hoy'];
    for(let i=1;i<=n;i++){ const int = b*(f-1); b = b*f + apo; serie.push(b); lab.push(mLabel(addM(M,i))); if(i<=n) rows.push([i,mLabel(addM(M,i)),int,apo,b]); }
    const ap = ini + apo*n; res = `<div class="grid g3"><div class="res"><div class="l">Valor final</div><div class="v num">${fmt(b)}</div></div><div class="res"><div class="l">Total aportado</div><div class="v num">${fmt(ap)}</div></div><div class="res"><div class="l">Ganancia</div><div class="v num ok">${fmt(b-ap)}</div></div></div>`;
    $('#iTbl').innerHTML = tabla(['Mes','Período','Interés','Aporte','Saldo'], rows.map(x=>[x[0],x[1],fmt(x[2]),fmt(x[3]),fmt(x[4])]));
  }
  if(s==='cda'){
    const c = parseNum(val('iCap2')), p = +val('iPag'); const tot = c*r*n/12; serie=[c]; lab=['Hoy']; let acum = 0;
    const per = p===0 ? n : p; const nper = Math.ceil(n/per);
    for(let k=1;k<=nper;k++){ const meses = Math.min(per, n-(k-1)*per); const int = c*r*meses/12; acum += int; rows.push([k, mLabel(addM(M,Math.min(n,k*per))), int, acum]); }
    for(let i=1;i<=n;i++){ serie.push(c + c*r*i/12); lab.push(mLabel(addM(M,i))); }
    res = `<div class="grid g3"><div class="res"><div class="l">Interés total</div><div class="v num ok">${fmt(tot)}</div></div><div class="res"><div class="l">${p?'Cobro por período':'Cobrás al vencer'}</div><div class="v num">${fmt(p?c*r*p/12:c+tot)}</div></div><div class="res"><div class="l">Rend. mensual equiv.</div><div class="v">${pct(r/12*100,2)}</div></div></div>`;
    $('#iTbl').innerHTML = tabla(['Pago','Fecha','Interés','Acumulado'], rows.map(x=>[x[0],x[1],fmt(x[2]),fmt(x[3])]));
  }
  if(s==='bono'){
    const N = parseNum(val('iNom')), fr = +val('iFre'), pr = parseNum(val('iPre'));
    const per = fr===0 ? n : fr, np = Math.ceil(n/per); const flujos = [];
    for(let k=1;k<=np;k++){ const meses = Math.min(per, n-(k-1)*per); const cup = N*r*meses/12; flujos.push(cup + (k===np?N:0)); rows.push([k, mLabel(addM(M,Math.min(n,k*per))), cup, k===np?N:0, cup+(k===np?N:0)]); }
    const totCup = sum(rows,x=>x[2]); let acum = 0; serie=[0]; lab=['Hoy']; rows.forEach(x=>{ acum += x[4]; serie.push(acum); lab.push(x[1]); });
    let tirTxt = '—';
    if(pr>0){ const vpn = i => -pr + flujos.reduce((s,f,k)=>s+f/Math.pow(1+i,k+1),0); let lo=-0.99, hi=5; for(let it=0;it<200;it++){ const mid=(lo+hi)/2; if(vpn(mid)>0) lo=mid; else hi=mid; }
      const ip = (lo+hi)/2, ppy = 12/per; tirTxt = `${pct(ip*ppy*100,2)} nominal · ${pct((Math.pow(1+ip,ppy)-1)*100,2)} efectiva`; }
    res = `<div class="grid g3"><div class="res"><div class="l">Cupones totales</div><div class="v num ok">${fmt(totCup)}</div></div><div class="res"><div class="l">Cobrás en total</div><div class="v num">${fmt(totCup+N)}</div></div><div class="res"><div class="l">TIR anual ${tip('Tasa interna de retorno: la tasa que iguala lo que pagás hoy con todos los cupones y el capital que vas a cobrar. Si compraste bajo la par, es mayor al cupón.')}</div><div class="v small" style="font-size:14px">${tirTxt}</div></div></div>`;
    $('#iTbl').innerHTML = tabla(['N°','Fecha','Cupón','Capital','Total'], rows.map(x=>[x[0],x[1],fmt(x[2]),fmt(x[3]),fmt(x[4])]));
  }
  $('#iRes').innerHTML = res; $('#iTit').textContent = s==='bono' ? 'Cobros acumulados' : 'Evolución del capital';
  mkChart('chInv',{type:s==='bono'?'bar':'line',data:{labels:lab,datasets:[{label:'Saldo',data:serie.map(round),borderColor:CONFIG.colorAcento,backgroundColor:hexA(CONFIG.colorAcento,s==='bono'?.7:.15),fill:true,tension:.3,pointRadius:0,borderRadius:5}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{ticks:{callback:v=>fmtK(v)}},x:{grid:{display:false},ticks:{maxTicksLimit:9}}}}});
}
const tabla = (h, rows) => `<table class="t"><thead><tr>${h.map((x,i)=>`<th class="${i>1?'r':''}">${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((x,i)=>`<td class="num ${i>1?'r':''}">${x}</td>`).join('')}</tr>`).join('')}</tbody></table>`;

const XLSX_CDN = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
const JSPDF_CDN = 'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js';
const AUTOTABLE_CDN = 'https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js';

async function exportExcel(){

async function exportPDF(){
  try{ toast('Generando PDF…'); await loadScript(JSPDF_CDN); await loadScript(AUTOTABLE_CDN);
    const d0 = val('rDes')||'0000', d1 = val('rHas')||'9999', tipo = val('rTip')||'todo';
    const { jsPDF } = window.jspdf; const doc = new jsPDF({unit:'pt',format:'a4'}); const W = doc.internal.pageSize.getWidth();
    const rgb = CONFIG.colorAcento.replace('#','').match(/.{2}/g).map(x=>parseInt(x,16));
    doc.setFillColor(...rgb); doc.rect(0,0,W,64,'F'); doc.setTextColor(255); doc.setFontSize(16); doc.setFont(undefined,'bold');
    doc.text(CONFIG.producto + (LIC.nombre?' · '+LIC.nombre:''), 36, 30); doc.setFontSize(10); doc.setFont(undefined,'normal'); doc.text(`Período ${fDate(d0)} al ${fDate(d1)}`, 36, 48);
    doc.setTextColor(30); let y = 88;
    const ms = S.movs.filter(m=>m.fecha>=d0 && m.fecha<=d1).sort((a,b)=>a.fecha.localeCompare(b.fecha));
    const ing = sum(ms.filter(x=>x.tipo==='ingreso'),x=>x.monto), gas = sum(ms.filter(x=>x.tipo==='gasto'),neto);
    const T = (head, body, opt={}) => { doc.autoTable(Object.assign({startY:y, head:[head], body, theme:'grid', styles:{fontSize:8.5,cellPadding:4}, headStyles:{fillColor:rgb}, margin:{left:36,right:36}}, opt)); y = doc.lastAutoTable.finalY + 18; };
    const H = t => { if(y > 740){ doc.addPage(); y = 50; } doc.setFontSize(12); doc.setFont(undefined,'bold'); doc.text(t,36,y); doc.setFont(undefined,'normal'); y += 8; };
    if(tipo!=='movs'){ H('Resumen'); T(['Concepto','Monto'], [['Ingresos del período',fmt(ing)],['Gastos del período',fmt(gas)],['Ahorro',fmt(ing-gas)],['Tasa de ahorro',ing?pct((ing-gas)/ing*100):'—'],['Saldo en cuentas (hoy)',fmt(saldoTotal())],['Deuda tarjetas (hoy)',fmt(deudaTarjetas())],['En metas (hoy)',fmt(metasTotal())],['Patrimonio neto (hoy)',fmt(patrimonio().neto)]], {columnStyles:{1:{halign:'right'}}});
      if(tipo==='todo'){ const by = {}; ms.filter(x=>x.tipo==='gasto').forEach(x=>by[x.cat]=(by[x.cat]||0)+neto(x)); H('Gastos por categoría'); T(['Categoría','Monto','%'], Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([c,v])=>[c,fmt(v),pct(v/(gas||1)*100)]), {columnStyles:{1:{halign:'right'},2:{halign:'right'}}}); }
      H('Gastos fijos · '+mLong(ym(d1))); T(['Gasto','Mensual','Arrastre','Pagado','Pendiente'], S.fijos.map(f=>{ const e = estadoFijo(f,ym(d1)); return [f.nombre,fmt(f.monto),fmt(e.arrastre),fmt(e.pagado),fmt(e.pendiente)]; }), {columnStyles:{1:{halign:'right'},2:{halign:'right'},3:{halign:'right'},4:{halign:'right'}}}); }
    if(tipo!=='res'){ H('Movimientos'); T(['Fecha','Tipo','Descripción','Categoría','Medio','Monto'], ms.map(m=>[fDate(m.fecha),m.tipo,m.desc||'',m.cat||m.fuente||'',m.tipo==='gasto'?(m.medio==='tarjeta'?nomTarjeta(m.tarjetaId):nomCuenta(m.cuentaId)):m.tipo==='pago'?nomTarjeta(m.tarjetaId):nomCuenta(m.cuentaId),(m.tipo==='ingreso'?'+':'−')+fmt(m.tipo==='gasto'?neto(m):m.monto)]), {columnStyles:{5:{halign:'right'}}}); }
    const pages = doc.getNumberOfPages(); for(let i=1;i<=pages;i++){ doc.setPage(i); doc.setFontSize(8); doc.setTextColor(140); doc.text(`${CONFIG.marca} · ${CONFIG.producto} v${CONFIG.version} · generado ${fDate(hoy())} · pág. ${i}/${pages}`, 36, doc.internal.pageSize.getHeight()-20); }
    doc.save(fileBase()+'.pdf'); toast('PDF descargado');
  }catch(e){ console.error(e); toast('Sin conexión para generar el PDF','err'); }
}

/* ═══════════════ PIN ═══════════════ */
let pinBuf = '', pinMode = 'unlock', pinTmp = '';
function lockScreen(title, sub){
  const L = $('#lock'); L.classList.remove('hide'); pinBuf = '';
  const keys = [['1',''],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],['7','PQRS'],['8','TUV'],['9','WXYZ']];
  L.innerHTML = `<div class="logo" style="width:56px;height:56px;font-size:18px;border-radius:16px">${/^https?:|^data:/.test(CONFIG.logoTexto)?`<img src="${CONFIG.logoTexto.replace(/"/g,'%22')}" alt="">`:esc(CONFIG.logoTexto)}</div><h2>${title}</h2><p>${sub}</p>
    <div class="dots" id="pDots">${'<i></i>'.repeat(4)}</div>
    <div class="pad">${keys.map(([k,l])=>`<button onclick="pinKey('${k}')">${k}<div style="font-size:9px;color:var(--tx3);letter-spacing:.1em;font-weight:500">${l}</div></button>`).join('')}
    <button class="ghost" onclick="${pinMode==='unlock'?'olvidePin()':"$('#lock').classList.add('hide')"}">${pinMode==='unlock'?'Olvidé':'Cancelar'}</button><button onclick="pinKey('0')">0</button><button class="ghost" onclick="pinKey('del')">⌫</button></div>`;
}
async function pinKey(k){
  if(k==='del') pinBuf = pinBuf.slice(0,-1); else if(pinBuf.length<4) pinBuf += k;
  document.querySelectorAll('#pDots i').forEach((d,i)=>d.classList.toggle('f', i<pinBuf.length));
  if(pinBuf.length<4) return;
  const p = pinBuf; pinBuf = '';
  if(pinMode==='unlock'){ if(await sha(LSKEY()+p) === S.ajustes.pinHash){ $('#lock').classList.add('hide'); render(); } else shake(); }
  else if(pinMode==='set1'){ pinTmp = p; pinMode = 'set2'; lockScreen('Repetí el PIN','Para confirmar'); }
  else if(pinMode==='set2'){ if(p===pinTmp){ S.ajustes.pinHash = await sha(LSKEY()+p); Store.save(); $('#lock').classList.add('hide'); render(); toast('PIN activado'); } else { pinMode='set1'; lockScreen('No coinciden','Elegí un PIN de 4 dígitos'); shake(); } }
}
function shake(){ const d = $('#pDots'); if(!d) return; d.classList.add('shake'); setTimeout(()=>{ d.classList.remove('shake'); d.querySelectorAll('i').forEach(i=>i.classList.remove('f')); },400); if(navigator.vibrate) navigator.vibrate(120); }
function configPin(){ pinMode = 'set1'; lockScreen('Elegí un PIN','4 dígitos para abrir la app'); }
function bloquear(){ pinMode = 'unlock'; lockScreen('Ingresá tu PIN', primerNombre()?`Acceso de ${esc(primerNombre())}`:'Acceso personal'); }
function olvidePin(){ if(!confirm('Sin el PIN, la única forma de entrar es BORRAR todos los datos de este dispositivo (podés importar un respaldo después). ¿Borrar?')) return;
  S = vacio(); Store.save(); $('#lock').classList.add('hide'); render(); toast('Datos borrados. Importá tu respaldo si tenés uno.'); }

  const st = TS[TI]; if(!st || !$('#tour').classList.contains('on')) return;
  const hole = $('#tour .hole'), tip = $('#tour .tcard');
  tip.innerHTML = `<div class="stp">Paso ${TI+1} de ${TS.length}</div><h4>${st.t}</h4><p>${st.p}</p>
    <div class="prog">${TS.map((_,i)=>`<i class="${i<=TI?'f':''}"></i>`).join('')}</div>
    <div class="act"><button class="sk2" onclick="tourEnd(false)">${st.last?'':'Saltar'}</button>
    ${TI>0?`<button class="btn sm" onclick="TI--;tourShow()">Atrás</button>`:''}
    <button class="btn sm pri" onclick="${st.last?'tourEnd()':'TI++;tourShow()'}">${st.last?'Entendido':TI===0?'Empezar':'Siguiente'}</button></div>`;
  const el = st.sel ? document.querySelector(st.sel) : null;
  const vw = innerWidth, vh = innerHeight, tw = tip.offsetWidth, th = tip.offsetHeight;
  if(!el){ hole.classList.add('none'); tip.style.left = (vw-tw)/2+'px'; tip.style.top = Math.max(16,(vh-th)/2)+'px'; return; }
  hole.classList.remove('none');
  const fixed = getComputedStyle(el).position === 'fixed' || el.closest('#nav');
  if(!fixed){ const r0 = el.getBoundingClientRect(); if(r0.top < 70 || r0.bottom > vh-140) window.scrollTo({top: scrollY + r0.top - 90}); }
  requestAnimationFrame(()=>{
    const r = el.getBoundingClientRect(), pad = 6;
    Object.assign(hole.style,{left:(r.left-pad)+'px',top:(r.top-pad)+'px',width:(r.width+pad*2)+'px',height:(r.height+pad*2)+'px'});
    let top = r.bottom + 14; if(top + th > vh - 10) top = r.top - th - 14; if(top < 10) top = Math.min(vh - th - 10, r.bottom + 14);
    let left = r.left + r.width/2 - tw/2; left = Math.max(12, Math.min(vw - tw - 12, left));
    tip.style.top = top+'px'; tip.style.left = left+'px';
  });
}
window.addEventListener('resize', ()=>{ if($('#tour').classList.contains('on')) tourPlace(); });
document.addEventListener('click', e=>{ if(e.target.closest('#fab') && $('#tour').classList.contains('on')) tourEnd(); }, true);
function tourAuto(){ try{ if(localStorage.getItem(TOUR_KEY())) return; }catch{ return; } setTimeout(()=>{ if(!$('#lock').classList.contains('hide')) return; tourStart(); }, 900); }

boot();
</script>
