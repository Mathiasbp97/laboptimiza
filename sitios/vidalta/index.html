<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vidalta · Showroom 3D · Bella Vista, Asunción</title>
<meta name="description" content="Recorré Vidalta desde el celular: elegí tu piso, mirá la planta y la disponibilidad en vivo, y cotizá tu departamento.">
<meta name="theme-color" content="#121413">
<meta property="og:title" content="Vidalta · Showroom 3D">
<meta property="og:description" content="Elegí tu piso, mirá cada departamento y su disponibilidad en vivo.">
<meta property="og:image" content="img/og.jpg">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css">
<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js" defer></script>
<style>
:root{--bg:#121413;--bg2:#1a1d1b;--bg3:#232724;--tx:#f2efe9;--tx2:#b7b3aa;--tx3:#7f7c75;--ln:rgba(242,239,233,.1);--ln2:rgba(242,239,233,.18);
  --ac:#C87941;--ok:#3fb27f;--res:#e0a33b;--ven:#8a8781;--r:14px;--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block;max-width:100%}
.num{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:999px;font-weight:600;font-size:14px;transition:transform .15s var(--ease),background .15s,border-color .15s;white-space:nowrap}
.btn svg{width:17px;height:17px;flex:none}
.btn-p{background:var(--ac);color:#fff}.btn-p:hover{background:#d78a52;transform:translateY(-1px)}
.btn-g{border:1px solid var(--ln2)}.btn-g:hover{border-color:var(--ac);color:var(--ac)}
.btn-w{background:#25D366;color:#fff}.btn-w:hover{background:#2fe07a}
.glass{background:rgba(18,20,19,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--ln);border-radius:var(--r)}

/* header */
header{position:fixed;inset:0 0 auto;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 20px;background:linear-gradient(rgba(10,11,10,.7),transparent)}
.logo{display:flex;align-items:center;gap:12px;color:#fff}
.logo svg{height:20px;width:auto}
.logo small{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--tx2);border-left:1px solid var(--ln2);padding-left:12px}
nav.tabs{display:flex;gap:4px;padding:4px;border-radius:999px}
nav.tabs button{padding:8px 14px;border-radius:999px;font-size:13.5px;font-weight:500;color:var(--tx2)}
nav.tabs button.on,nav.tabs button:hover{background:rgba(242,239,233,.1);color:var(--tx)}
@media(max-width:860px){.logo small{display:none}nav.tabs{display:none}header .btn span{display:none}header .btn{padding:10px}}

/* stage */
#stage{position:fixed;inset:0}
.view{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .45s var(--ease)}
.view.on{opacity:1;pointer-events:auto}
.media{position:absolute;inset:0}
.media img{width:100%;height:100%;object-fit:cover}
.media svg{position:absolute;inset:0;width:100%;height:100%}
.media.fit img{object-fit:contain}
/* vertical: la fachada ocupa el ancho (recorta los árboles laterales) y el fondo es la misma imagen difuminada */
#mTorre>img{position:absolute;inset:0}
#mTorre img.noche{transition:opacity .9s var(--ease)}
#mTorre.dia img.noche{opacity:0}
#dn{position:absolute;left:20px;bottom:24px;z-index:6;display:flex;padding:4px;border-radius:999px;gap:2px}
#dn button{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;font-size:12.5px;font-weight:600;color:var(--tx2)}
#dn button.on{background:rgba(242,239,233,.14);color:var(--tx)}
#dn svg{width:15px;height:15px}
@media(max-width:860px){#dn{left:auto;right:10px;bottom:84px}#dn button{padding:6px 10px}}
#mTorre.port{background:#151716}
#mTorre.port:before{content:"";position:absolute;inset:-30px;background:url(img/torre-noche.webp) center/cover;filter:blur(24px) brightness(.5)}
#mTorre.port img,#mTorre.port svg{position:absolute;max-width:none;width:190%;height:auto;aspect-ratio:16/9;left:-40%;top:47%;transform:translateY(-50%)}
#vTorre .media:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,11,10,.55),transparent 35%,transparent 70%,rgba(10,11,10,.45));pointer-events:none}
.fl{fill:rgba(255,255,255,0);stroke:transparent;stroke-width:2;cursor:pointer;transition:fill .2s,stroke .2s}
.fl:hover,.fl.hl{fill:rgba(200,121,65,.34);stroke:#f0b487;stroke-width:2.5}
.fl.dim{fill:rgba(10,11,10,.45)}
.flLbl{font-size:15px;font-weight:700;fill:#fff;pointer-events:none;paint-order:stroke;stroke:rgba(0,0,0,.45);stroke-width:3px;opacity:0;transition:opacity .2s}
.flLbl.on{opacity:1}

/* hero compacto: la fachada es la protagonista */
#hero{position:absolute;left:20px;top:74px;max-width:330px;padding:12px 14px;z-index:5}
#hero .k{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ac);font-weight:700}
#hero .l1{display:flex;gap:14px;align-items:baseline;margin-top:4px;flex-wrap:wrap}
#hero .l1 b{font-size:17px;font-weight:700}#hero .l1 span{font-size:12.5px;color:var(--tx2)}
.live{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:var(--tx2);margin-top:6px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(63,178,127,.6);animation:pl 2s infinite}
@keyframes pl{70%{box-shadow:0 0 0 8px rgba(63,178,127,0)}100%{box-shadow:0 0 0 0 rgba(63,178,127,0)}}
#filtros{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
#filtros::-webkit-scrollbar{display:none}
.qk{display:none;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none}.qk button{flex:none;padding:6px 11px;border-radius:999px;font-size:12px;font-weight:600;background:rgba(200,121,65,.16);color:#f0b487;border:1px solid rgba(200,121,65,.4);white-space:nowrap}
#filtros button{padding:5px 10px;border-radius:999px;font-size:12px;color:var(--tx2);white-space:nowrap;flex:none;border:1px solid var(--ln)}
#filtros button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.hint{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);font-size:12.5px;color:var(--tx2);padding:8px 14px;border-radius:999px;z-index:4;pointer-events:none;transition:opacity .6s}
.hint.off{opacity:0}

/* riel de pisos (angosto, a la derecha) */
#floors{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:132px;padding:8px;z-index:5}
.ph{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx3);font-weight:700;margin:2px 4px 6px}
.frow{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;padding:7px 8px;border-radius:8px;font-size:13px;transition:background .15s}
.frow:hover,.frow.hl{background:rgba(242,239,233,.1)}
.frow b{font-weight:600}
.frow .n{font-size:11px;font-weight:700;color:#6fd3a5;background:rgba(63,178,127,.14);border-radius:999px;padding:1px 7px;min-width:22px;text-align:center}
.frow .n.z{color:var(--tx3);background:rgba(242,239,233,.06)}
.legend{display:flex;flex-direction:column;gap:3px;font-size:10.5px;color:var(--tx2);margin-top:6px;padding:6px 4px 2px;border-top:1px solid var(--ln)}
.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:7px;height:7px;border-radius:50%}
.d-libre{background:var(--ok)}.d-reservado{background:var(--res)}.d-vendido{background:var(--ven);opacity:.55}.d-bloqueado{background:var(--ven);opacity:.3}

/* hotspots sobre la fachada */
.hs{cursor:pointer}
.hs .o{fill:var(--ac);opacity:.5;transform-box:fill-box;transform-origin:center;animation:hsp 2.2s infinite}
@keyframes hsp{0%{transform:scale(1);opacity:.55}100%{transform:scale(2.6);opacity:0}}
.hs .c{fill:#C87941;stroke:#fff;stroke-width:3}
.hs .o{fill:#C87941}
.hs .lbl rect{fill:rgba(12,13,12,.82)}
.hs .lbl text{fill:#fff;font-size:15px;font-weight:600;font-family:"Plus Jakarta Sans",system-ui}
.hs:hover .lbl rect{fill:var(--ac)}

@media(max-width:860px){
 #filtros{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.qk{display:flex}
 #hero{top:66px;left:10px;right:10px;max-width:none;padding:10px 12px}#hero .l1 b{font-size:15px}.live{display:none}
 #floors{top:auto;bottom:12px;right:10px;left:10px;transform:none;width:auto;padding:6px}
 #floors .frows{display:flex;gap:4px;overflow-x:auto}#floors .frow{flex-direction:column;min-width:54px;padding:6px 4px;gap:3px;font-size:12px}#floors .legend,#floors .ph{display:none}
 .hint{display:none}.hs .lbl text{font-size:22px}}

/* planta */
#vPlanta{background:radial-gradient(1200px 700px at 50% 45%,#202421,#101211)}
#vPlanta .media{inset:110px 290px 40px 40px}
.u{cursor:pointer;transition:fill .2s,stroke .2s}
.u rect{rx:6;stroke-width:3}
.u.libre rect{fill:rgba(63,178,127,.16);stroke:#3fb27f}
.u.reservado rect{fill:rgba(224,163,59,.2);stroke:#e0a33b}
.u.vendido rect{fill:rgba(20,20,20,.58);stroke:rgba(138,135,129,.7)}
.u.bloqueado rect{fill:rgba(20,20,20,.7);stroke:rgba(138,135,129,.4)}
.u:hover rect,.u.sel rect{stroke:#fff;stroke-width:5}
.u.libre:hover rect{fill:rgba(63,178,127,.48)}
.u.off{opacity:.25}
.u text{font-size:24px;font-weight:700;fill:#fff;pointer-events:none;paint-order:stroke;stroke:rgba(0,0,0,.55);stroke-width:4px}
.u text.s{font-size:15px;font-weight:600;fill:rgba(255,255,255,.9)}
#pHead{position:absolute;left:40px;top:84px;display:flex;align-items:center;gap:14px;z-index:5}
#pHead h2{font-size:26px;font-weight:600}
.step{display:flex;gap:4px}.step button{width:36px;height:36px;border-radius:10px;border:1px solid var(--ln2);display:grid;place-items:center}.step button:hover{border-color:var(--ac)}
.step svg{width:16px;height:16px}
#pSide{position:absolute;right:20px;top:84px;bottom:24px;width:250px;padding:14px;overflow:auto;z-index:5}
.urow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;width:100%;padding:10px;border-radius:10px;text-align:left;transition:background .15s}
.urow:hover,.urow.sel{background:rgba(242,239,233,.07)}
.urow .badge{width:9px;height:9px;border-radius:50%}
.urow b{display:block;font-size:14px}.urow small{color:var(--tx3);font-size:12px}
.urow .pr{font-size:13px;font-weight:600;text-align:right}
.urow.vendido{opacity:.55}
.north{position:absolute;left:40px;bottom:30px;font-size:12px;color:var(--tx3);display:flex;gap:10px;align-items:center}
@media(max-width:860px){#vPlanta .media{inset:120px 0 225px 0;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch}#mPlanta img,#mPlanta svg{position:absolute;left:0;top:50%;transform:translateY(-50%);width:980px;max-width:none;height:333px}#pHead{left:14px;top:74px}#pHead h2{font-size:20px}#pSide{top:auto;bottom:12px;left:12px;right:12px;width:auto;height:205px}.north{display:none}}

/* drawer */
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--bg2);border-left:1px solid var(--ln);z-index:60;transform:translateX(100%);transition:transform .4s var(--ease);display:flex;flex-direction:column}
#drawer.on{transform:none}
#drawer .top{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--ln)}
#drawer .body{overflow:auto;padding:20px;flex:1}
#drawer .foot{padding:14px 20px;border-top:1px solid var(--ln);display:flex;gap:8px}
#drawer .foot .btn{flex:1}
.x{width:36px;height:36px;border-radius:10px;border:1px solid var(--ln2);display:grid;place-items:center;flex:none}.x:hover{border-color:var(--ac)}
.x svg{width:16px;height:16px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:999px}
.tag.libre{background:rgba(63,178,127,.16);color:#6fd3a5}.tag.reservado{background:rgba(224,163,59,.16);color:#f0bd62}.tag.vendido,.tag.bloqueado{background:rgba(138,135,129,.18);color:#bdb9b1}
.price{font-size:32px;font-weight:700;margin-top:6px}
.price small{font-size:13px;font-weight:500;color:var(--tx3);margin-left:6px}
.specs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}
.spec{background:var(--bg3);border-radius:10px;padding:10px;text-align:center}
.spec b{display:block;font-size:18px}.spec small{font-size:11px;color:var(--tx3)}
.plano{border-radius:12px;overflow:hidden;background:#f4f1ea;cursor:zoom-in;margin-bottom:12px}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:18px}
.gal img{aspect-ratio:4/3;object-fit:cover;border-radius:8px;cursor:zoom-in;transition:opacity .2s}.gal img:hover{opacity:.85}
.h3{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx3);font-weight:700;margin:18px 0 10px}
.desc{color:var(--tx2);font-size:14px}
.cot{background:var(--bg3);border-radius:12px;padding:14px}
.cot label{display:flex;justify-content:space-between;font-size:13px;color:var(--tx2);margin-top:10px}
.cot input[type=range]{width:100%;accent-color:var(--ac)}
.cot .row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--ln);font-size:14px}
.cot .row:last-child{border:0}
.cot .row b{font-weight:700}
.fine{font-size:11.5px;color:var(--tx3);margin-top:8px}
.vend-msg{background:var(--bg3);border-radius:12px;padding:16px;color:var(--tx2);font-size:14px}

/* galleries / modal */
#modal{position:fixed;inset:0;z-index:80;background:rgba(8,9,8,.88);display:none;align-items:center;justify-content:center;padding:24px}
#modal.on{display:flex}
#modal .box{width:min(1200px,100%);max-height:100%;overflow:auto}
#modal .mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
#modal h2{font-size:26px;font-weight:600}
.agrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.agrid figure{position:relative;border-radius:12px;overflow:hidden;cursor:zoom-in;aspect-ratio:16/10;background:#222}
.agrid figure img{width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease)}
.agrid figure:hover img{transform:scale(1.05)}
.agrid figcaption{position:absolute;left:0;right:0;bottom:0;padding:30px 14px 12px;background:linear-gradient(transparent,rgba(0,0,0,.75));font-weight:600}
@media(max-width:760px){.agrid{grid-template-columns:1fr 1fr}}
#lb{position:fixed;inset:0;z-index:90;background:rgba(5,6,5,.95);display:none;align-items:center;justify-content:center}
#lb.on{display:flex}
#lb img{max-width:96vw;max-height:88vh;border-radius:8px}
#lb .x{position:absolute;top:16px;right:16px}
#lb p{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:var(--tx2)}
.ubi{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:center}
.ubi img{border-radius:14px}
.ubi p{color:var(--tx2);margin-top:10px}
@media(max-width:760px){.ubi{grid-template-columns:1fr}}

#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,120%);z-index:100;padding:11px 18px;border-radius:999px;font-size:13.5px;transition:transform .3s var(--ease)}
#toast.on{transform:translate(-50%,0)}
.skel{position:fixed;inset:0;display:grid;place-items:center;z-index:200;background:var(--bg);transition:opacity .5s}
.skel.off{opacity:0;pointer-events:none}
.skel svg{width:180px;color:#fff;opacity:.9;animation:fd 1.4s ease-in-out infinite alternate}
@keyframes fd{to{opacity:.35}}

/* transiciones cinemáticas */
#mTorre{transition:transform .8s var(--ease)}
#vPlanta.on .media{animation:pIn .75s var(--ease) both}
@keyframes pIn{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){#mTorre{transition:none}#vPlanta.on .media{animation:none}}
.urow .rec{display:inline-block;margin-left:6px;font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--ac);border:1px solid rgba(200,121,65,.5);border-radius:999px;padding:1px 6px;vertical-align:1px}
.u text.r{font-size:13px;font-weight:700;fill:#f0b487}

/* botón recorrido en ficha */
.recBtn{position:relative;display:block;width:100%;aspect-ratio:16/8;border-radius:14px;overflow:hidden;background-size:cover;background-position:center;margin:4px 0 6px;text-align:left}
.recBtn:before{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,rgba(0,0,0,.78))}
.recBtn .pl{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;background:var(--ac);display:grid;place-items:center;box-shadow:0 0 0 10px rgba(200,121,65,.25);transition:transform .2s var(--ease)}
.recBtn:hover .pl{transform:translate(-50%,-50%) scale(1.08)}
.recBtn .pl svg{width:22px;height:22px;margin-left:3px}
.recBtn b,.recBtn small{position:absolute;left:16px;right:16px;z-index:1}
.recBtn b{bottom:30px;font-size:17px}.recBtn small{bottom:12px;color:#d9d5cd;font-size:12px}

/* recorrido */
#rec{position:fixed;inset:0;z-index:75;background:#0c0d0c;opacity:0;pointer-events:none;transition:opacity .45s var(--ease);overflow:hidden}
#rec.on{opacity:1;pointer-events:auto}
#rec .rp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:96px 24px 120px;background:radial-gradient(1000px 600px at 50% 50%,#262a27,#0f1110);transition:opacity .5s var(--ease)}
#rec .rp.off{opacity:0;pointer-events:none}
.rpwrap{position:relative;width:min(100%,calc((100vh - 230px)*1.42));aspect-ratio:1800/1268;transition:transform .9s var(--ease),opacity .9s var(--ease)}
.rpwrap img{width:100%;height:100%;border-radius:10px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.rpwrap svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.pin{cursor:pointer}
.pin .o{animation:pp 2s infinite;transform-box:fill-box;transform-origin:center}
@keyframes pp{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(2.4)}}
.pin .lb{transition:transform .2s var(--ease)}
.pin:hover .lb{transform:translateY(-6px)}
#rec .ra{position:absolute;inset:0;cursor:grab;touch-action:pan-y;pointer-events:none}
#rec .ra.act{pointer-events:auto}
#rec .ra.drag{cursor:grabbing}
#rec .ra img{position:absolute;top:0;left:0;height:100%;width:auto;max-width:none;min-width:100%;object-fit:cover;user-select:none;-webkit-user-drag:none;opacity:0;transition:opacity .7s var(--ease);will-change:transform,opacity}
#rec .ra img.on{opacity:1}
#raV{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s;pointer-events:none;z-index:1}
#raV.on{opacity:1}
#rec.vid .rnav,#rec.vid .rthumbs,#rec.vid .rhint{opacity:.35;pointer-events:none}
#rec .ra:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(rgba(0,0,0,.55),transparent 22%,transparent 68%,rgba(0,0,0,.65))}
.rtop{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:18px 20px;z-index:3}
.rtop{text-shadow:0 1px 12px rgba(0,0,0,.55)}
.rtop small{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ac);font-weight:700}
.rtop b{display:block;font-size:26px;font-weight:600;line-height:1.2}
.ract{display:flex;gap:8px}
.rnav{position:absolute;left:50%;bottom:104px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:6px;border-radius:999px;z-index:3}
.rnav button{height:40px;padding:0 14px;border-radius:999px;display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;white-space:nowrap}
.rnav button:hover:not(:disabled){background:rgba(242,239,233,.1)}
.rnav button:disabled{opacity:.3;cursor:default}
.rnav svg{width:16px;height:16px}
.rnav #rNext{background:var(--ac);color:#fff}
.rnav #rNext:hover:not(:disabled){background:#d78a52}
.rnav span{font-size:12.5px;color:var(--tx2);padding:0 6px;white-space:nowrap}
.rthumbs{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:8px;z-index:3;max-width:calc(100% - 24px);overflow-x:auto;padding:2px}
.rthumbs button{flex:none;width:112px;height:64px;border-radius:10px;background-size:cover;background-position:center;position:relative;overflow:hidden;border:2px solid transparent;transition:border-color .15s,transform .15s}
.rthumbs button:hover{transform:translateY(-2px)}
.rthumbs button.on{border-color:var(--ac)}
.rthumbs button span{position:absolute;left:0;right:0;bottom:0;padding:12px 6px 4px;font-size:11px;font-weight:600;background:linear-gradient(transparent,rgba(0,0,0,.8));text-align:left}
.rhint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 16px;border-radius:999px;font-size:13px;z-index:3;pointer-events:none;transition:opacity .6s}
.rhint.off{opacity:0}
.rfine{position:absolute;right:16px;bottom:96px;font-size:11px;color:rgba(255,255,255,.55);z-index:3}
@media(max-width:860px){.rtop b{font-size:20px}.rtop .btn span{display:none}.rnav{bottom:96px;max-width:calc(100% - 24px)}.rnav #rPrev span{display:none}.rthumbs button{width:92px;height:56px}.rfine{display:none}#rec .rp{padding:84px 10px 110px}}

/* visor de espacios (amenities, lobby, 360) */
#xp{position:fixed;inset:0;z-index:77;background:#0b0c0b;opacity:0;pointer-events:none;transition:opacity .4s var(--ease)}
#xp.on{opacity:1;pointer-events:auto}
#xpPano,#xpImg{position:absolute;inset:0;transition:opacity .45s}
#xpPano.off,#xpImg.off{opacity:0;pointer-events:none}
#xpPano .pnlm-load-box{background:rgba(12,13,12,.8)}
#xpImg .bg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(28px) brightness(.45);transform:scale(1.1)}
#xpImg img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:opacity .45s}
#xpImg img.fade{opacity:0}
#xp:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(rgba(0,0,0,.5),transparent 20%,transparent 66%,rgba(0,0,0,.72))}
.xtop{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:18px 20px;z-index:3;text-shadow:0 1px 12px rgba(0,0,0,.5)}
.xtop small{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ac);font-weight:700}
.xtop b{display:block;font-size:24px;font-weight:600}
.xnav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;z-index:3}
.xnav svg{width:18px;height:18px}#xpPrev{left:16px}#xpNext{right:16px}
.xnav:hover{border-color:var(--ac);color:var(--ac)}
.xhint{position:absolute;left:50%;top:84px;transform:translateX(-50%);font-size:12.5px;padding:7px 14px;background:rgba(10,11,10,.72);border-radius:999px;z-index:3;pointer-events:none;transition:opacity .5s}
.xhint.off{opacity:0}
.xbot{position:absolute;left:0;right:0;bottom:0;padding:0 16px 16px;z-index:3;display:flex;flex-direction:column;align-items:center;gap:10px}
.xthumbs,.xchips{display:flex;gap:8px;max-width:100%;overflow-x:auto;scrollbar-width:none;padding:2px}
.xthumbs::-webkit-scrollbar,.xchips::-webkit-scrollbar{display:none}
.xthumbs button{flex:none;width:104px;height:62px;border-radius:9px;background-size:cover;background-position:center;border:2px solid transparent;position:relative;overflow:hidden;transition:border-color .15s,transform .15s}
.xthumbs button:hover{transform:translateY(-2px)}.xthumbs button.on{border-color:var(--ac)}
.xthumbs button i{position:absolute;right:5px;top:5px;font-style:normal;font-size:10px;font-weight:700;background:rgba(0,0,0,.65);padding:2px 6px;border-radius:999px}
.xchips button{flex:none;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;background:rgba(18,20,19,.72);border:1px solid var(--ln2);backdrop-filter:blur(10px);white-space:nowrap}
.xchips button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.b360{display:inline-flex;align-items:center;gap:6px}
@media(max-width:860px){.xtop b{font-size:19px}.xnav{display:none}.xthumbs button{width:84px;height:52px}.xchips button{padding:7px 12px;font-size:12.5px}}
@media print{#rec{display:none}#xp{display:none}body{overflow:visible}header,#filtros,#floors,.hint,#stage{display:none}#drawer{position:static;transform:none;width:100%;border:0}#drawer .foot{display:none}}

function ubicacion() { abrirModal(`<div class="mh"><h2>Ubicación</h2>${cerrarBtn}</div><div class="ubi"><img src="img/aerea.webp" alt="Vista aérea" data-zoom="img/aerea.webp" data-cap="Vidalta · Bella Vista" style="cursor:zoom-in"><div>
  <div class="h3" style="margin-top:0">Barrio Bella Vista · Asunción</div><p>Sobre Tte. 1º Porfirio Saldívar casi Fray Luis de León, zona Club Centenario, entre el centro histórico y el nuevo eje corporativo. Cerca de colegios, sanatorios, locales comerciales y la mejor gastronomía de Asunción.</p>
  <p>Cocheras simples, dobles y con baulera disponibles.</p><div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap"><a class="btn btn-g" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=Teniente+Porfirio+Saldivar+y+Fray+Luis+de+Leon+Asuncion">Abrir en Google Maps ↗</a></div></div></div>`); }

/* ---------- navegación ---------- */
function setView(v) { UI.view = v; $('#vTorre').classList.toggle('on', v === 'torre'); $('#vPlanta').classList.toggle('on', v === 'planta'); }
function pintar() { pintarTorre(); if (UI.view === 'planta') pintarPlanta(); }
$('#backT').onclick = () => { cerrarFicha(); volverTorre(); };
$('#pUp').onclick = () => irPiso(UI.piso + 1); $('#pDn').onclick = () => irPiso(UI.piso - 1);
$('#dX').onclick = cerrarFicha;
$('#lbX').onclick = () => $('#lb').classList.remove('on'); $('#lb').onclick = e => { if (e.target.id === 'lb') $('#lb').classList.remove('on'); };
$('#modal').onclick = e => { if (e.target.id === 'modal') cerrarModal(); };
$$('#tabs button').forEach(b => b.onclick = () => { $$('#tabs button').forEach(x => x.classList.toggle('on', x === b)); const g = b.dataset.go;
  if (g === 'torre') { cerrarModal(); setView('torre'); } else if (g === 'amen') abrirXP('piscina'); else abrirXP('barrio'); });
document.addEventListener('keydown', e => { if ($('#xp').classList.contains('on')) { if (e.key === 'Escape') cerrarXP(); else if (e.key === 'ArrowRight') xpPaso(1); else if (e.key === 'ArrowLeft') xpPaso(-1); return; }
  if (REC.on) { if (e.key === 'Escape') { e.stopImmediatePropagation(); REC.amb >= 0 ? recPlano() : cerrarRec(); } else if (e.key === 'ArrowRight') recIr(REC.amb + 1); else if (e.key === 'ArrowLeft' && REC.amb > 0) recIr(REC.amb - 1); return; }
  if (e.key === 'Escape') { if ($('#lb').classList.contains('on')) $('#lb').classList.remove('on'); else if ($('#modal').classList.contains('on')) cerrarModal(); else if ($('#drawer').classList.contains('on')) cerrarFicha(); else if (UI.view === 'planta') volverTorre(); }
  if (UI.view === 'planta' && !$('#drawer').classList.contains('on')) { if (e.key === 'ArrowUp') irPiso(UI.piso + 1); if (e.key === 'ArrowDown') irPiso(UI.piso - 1); } });
$$('#dn button').forEach(b => b.onclick = () => { $('#mTorre').classList.toggle('dia', b.dataset.m === 'dia'); $$('#dn button').forEach(x => x.classList.toggle('on', x === b)); });
$('#waTop').href = wa('Hola 👋 Estoy viendo el showroom de Vidalta y quiero más información.');
addEventListener('resize', ajustarTorre); ajustarTorre();

(async () => {
  await cargar();
  const m = location.hash.match(/u=(\d{3})/);
  if (m && U.find(u => u.id === m[1])) { const u = U.find(x => x.id === m[1]); UI.piso = u.piso; setView('planta'); pintarPlanta(); abrirFicha(u.id); }
  setTimeout(() => $('#skel').classList.add('off'), 250);
  setInterval(cargar, CONFIG.refrescoSeg * 1000);
})();
</script>
</body>
</html>
