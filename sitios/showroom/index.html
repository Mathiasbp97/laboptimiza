<!--
CONTEXTO
========
Showroom 3D white-label para desarrolladoras inmobiliarias. Un solo archivo, sin build.

Arquitectura
- CONFIG (inicio del <script type="module">): marca, proyecto, colores, moneda, WhatsApp, PIN admin,
  parámetros del edificio, del cotizador y URL opcional de planilla (CSV publicado de Google Sheets).
- DATA: unidades generadas desde CONFIG.edificio (o importadas por JSON / planilla). Cada unidad:
  {id, piso, letra, tipo, dorm, banos, m2, balcon, orient, precio, estado}.
- Escena (Three.js): torre procedural; cada unidad es un "vidrio" clickeable coloreado por estado.
- UI: KPIs, filtros, panel de unidad (plano SVG + cotizador), lista ordenable, modo admin.
- Persistencia: localStorage (clave showroom.<slug>). Planilla en vivo: polling cada CONFIG.planilla.cadaSeg.

Planos de venta (orientativo)
- Básico (estático): CONFIG.planilla.url = "" y modo admin deshabilitado (CONFIG.admin=false).
- En vivo: CONFIG.planilla.url = CSV publicado con columnas: unidad,estado,precio  (estado: disponible|reservado|vendido).
- Premium: agregar CONFIG.galeria por tipología (imágenes / videos cortos por ambiente).

Cotizador (auditable)
- Anticipo = Precio × anticipo%
- Cuotas en pozo (sin interés) = Precio × cuotas% / N cuotas
- Saldo a la entrega = Precio − anticipo − total cuotas
- Si se financia el saldo: PMT = S·i / (1 − (1+i)^−n), i = tasa anual/12, n = años×12

Extender
- Otra torre / forma: editar construirEdificio() y CONFIG.edificio.
- Otra planilla: adaptar parseCSV() (mapea columnas por nombre de encabezado).
-->
<style>
:root{--ac:#3B82F6;--bg:#0F1115;--bg2:#16181D;--bd:rgba(255,255,255,.08);--tx:#E8EAED;--mu:#9AA0AA;--ok:#10B981;--wa:#F59E0B;--no:#EF4444}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.num{font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select{font-family:inherit;font-size:14px;color:var(--tx);background:#0B0C10;border:1px solid var(--bd);border-radius:10px;padding:9px 10px;width:100%;outline:none;transition:border-color .15s}
input:focus,select:focus{border-color:var(--ac)}
#app{display:grid;grid-template-rows:auto 1fr;height:100%}
header{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--bd);background:var(--bg);z-index:5}
.logo{width:36px;height:36px;border-radius:10px;background:var(--ac);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff;flex-shrink:0;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.ttl b{display:block;font-size:15px;font-weight:700;letter-spacing:-.01em}.ttl span{font-size:12px;color:var(--mu)}
.kpis{display:flex;gap:8px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.kpi{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:6px 12px;white-space:nowrap}
.kpi small{display:block;font-size:10.5px;color:var(--mu);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.kpi b{font-size:15px;font-weight:700}
.live{display:none;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ok);background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);padding:6px 10px;border-radius:999px;white-space:nowrap}
.live i{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pl 1.6s infinite}
@keyframes pl{50%{opacity:.3}}
.hbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--bd);background:var(--bg2);display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0}
.hbtn:hover{background:#1E2128}
main{position:relative;display:grid;grid-template-columns:1fr 390px;min-height:0}
#stage{position:relative;min-height:0}
#c3d{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.float{position:absolute;z-index:3}
#filters{top:14px;left:14px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 28px)}
.pill{padding:8px 12px;border-radius:999px;background:rgba(22,24,29,.88);backdrop-filter:blur(8px);border:1px solid var(--bd);font-size:13px;font-weight:600;color:var(--mu);transition:all .15s}
.pill:hover{color:var(--tx)}.pill.on{background:var(--ac);border-color:var(--ac);color:#fff}
#legend{bottom:14px;left:14px;display:flex;gap:12px;padding:8px 12px;border-radius:12px;background:rgba(22,24,29,.88);backdrop-filter:blur(8px);border:1px solid var(--bd);font-size:12px;color:var(--mu)}
#legend span{display:flex;align-items:center;gap:6px}#legend i{width:10px;height:10px;border-radius:3px}
#views{bottom:14px;right:14px;display:flex;gap:6px}
#tip{pointer-events:none;padding:8px 10px;border-radius:10px;background:#0B0C10;border:1px solid var(--bd);font-size:12.5px;opacity:0;transition:opacity .12s;white-space:nowrap}
#tip b{font-size:13px}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--mu);font-size:13px;background:var(--bg);z-index:4;transition:opacity .4s}
.sk{width:220px;height:8px;border-radius:4px;background:linear-gradient(90deg,#1A1D23,#262A33,#1A1D23);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
aside{border-left:1px solid var(--bd);background:var(--bg);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:4px;padding:10px 12px;border-bottom:1px solid var(--bd)}
.tab{flex:1;padding:9px;border-radius:10px;font-size:13px;font-weight:600;color:var(--mu);transition:all .15s}
.tab.on{background:var(--bg2);color:var(--tx);border:1px solid var(--bd)}
.pane{flex:1;overflow-y:auto;padding:14px;display:none}.pane.on{display:block}
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.uh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.uh h2{font-size:22px;font-weight:800;letter-spacing:-.02em}.uh p{font-size:13px;color:var(--mu);margin-top:2px}
.st{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap}
.st.disponible{background:rgba(16,185,129,.12);color:var(--ok)}.st.reservado{background:rgba(245,158,11,.12);color:var(--wa)}.st.vendido{background:rgba(239,68,68,.12);color:var(--no)}
.price{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:12px}.price small{font-size:12px;color:var(--mu);font-weight:500;margin-left:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.cell{background:#0B0C10;border:1px solid var(--bd);border-radius:10px;padding:9px 10px}
.cell small{display:block;font-size:11px;color:var(--mu)}.cell b{font-size:14px}
.sec{font-size:12px;font-weight:700;color:var(--mu);letter-spacing:.06em;text-transform:uppercase;margin:4px 0 10px;display:flex;align-items:center;gap:6px}
.plan{background:#F7F7F5;border-radius:10px;padding:8px}
.plan svg{width:100%;height:auto;display:block}
.row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:13.5px;border-bottom:1px dashed var(--bd)}
.row:last-child{border:0}.row span{color:var(--mu)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.f2 label{font-size:11.5px;color:var(--mu);display:block;margin-bottom:4px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;border-radius:12px;font-weight:700;font-size:14px;transition:filter .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn.p{background:var(--ac);color:#fff}.btn.p:hover{filter:brightness(1.1)}
.btn.g{background:var(--bg2);border:1px solid var(--bd)}.btn.g:hover{background:#1E2128}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.empty{text-align:center;padding:40px 16px;color:var(--mu);font-size:14px;line-height:1.5}
.empty b{display:block;color:var(--tx);font-size:16px;margin-bottom:6px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;color:var(--mu);font-weight:600;padding:8px 6px;border-bottom:1px solid var(--bd);cursor:pointer;user-select:none;white-space:nowrap}
th:hover{color:var(--tx)}
td{padding:9px 6px;border-bottom:1px solid var(--bd);white-space:nowrap}
tr.r{cursor:pointer;transition:background .12s}tr.r:hover{background:var(--bg2)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.tip-i{display:inline-flex;width:15px;height:15px;border-radius:50%;border:1px solid var(--mu);font-size:10px;align-items:center;justify-content:center;color:var(--mu);cursor:help;position:relative}
.tip-i:hover::after{content:attr(data-t);position:absolute;bottom:130%;left:50%;transform:translateX(-50%);width:220px;background:#0B0C10;border:1px solid var(--bd);padding:8px 10px;border-radius:8px;font-size:12px;color:var(--tx);text-transform:none;letter-spacing:0;font-weight:500;line-height:1.4;z-index:20}
#toasts{position:fixed;top:66px;left:50%;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{background:#0B0C10;border:1px solid var(--bd);padding:10px 14px;border-radius:12px;font-size:13px;font-weight:600;animation:ti .2s ease-out}
@keyframes ti{from{opacity:0;transform:translateY(-6px)}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.mbox{background:var(--bg);border:1px solid var(--bd);border-radius:16px;width:100%;max-width:440px;max-height:90vh;overflow:auto;padding:18px}
.mbox h3{font-size:17px;margin-bottom:12px}
.mi{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;font-size:14px;font-weight:600;width:100%;text-align:left;transition:background .12s}
.mi:hover{background:var(--bg2)}
.adm{display:none}.admin .adm{display:block}
@media (max-width:860px){
 main{grid-template-columns:1fr;grid-template-rows:1fr auto}
 aside{position:absolute;left:0;right:0;bottom:0;max-height:58%;border-left:0;border-top:1px solid var(--bd);border-radius:18px 18px 0 0;z-index:6;transition:transform .25s}
 aside.min{transform:translateY(calc(100% - 52px))}
 .grab{display:block!important}
 .kpis .kpi:nth-child(n+2){display:none}
 .ttl span{display:none}
 #legend{bottom:66px;font-size:11.5px;gap:9px}#views{bottom:112px}
}
.grab{display:none;width:44px;height:5px;border-radius:3px;background:#3A3F4A;margin:8px auto 0}
@media print{
 header .kpis,header .hbtn,#stage,.tabs,.no-print{display:none!important}
 html,body{overflow:visible;background:#fff;color:#111}
 main{display:block}aside{border:0;position:static;max-height:none}
 .pane{display:block!important;overflow:visible}.card{border-color:#ddd;background:#fff}
}
</style>
</head>
<body>
<div id="app">
 <header>
  <div class="logo" id="logo"></div>
  <div class="ttl"><b id="pName"></b><span id="pSub"></span></div>
  <div class="kpis" id="kpis"></div>

  <button class="hbtn" id="menuBtn" title="Menú" aria-label="Menú"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
 </header>
 <main>
  <section id="stage">
   <canvas id="c3d"></canvas>

   <div class="tabs"><button class="tab on" data-p="pU">Unidad</button><button class="tab" data-p="pL">Lista</button><button class="tab" data-p="pP">Proyecto</button></div>
   <div class="pane on" id="pU"></div>
   <div class="pane" id="pL"></div>
   <div class="pane" id="pP"></div>

 </main>
</div>
<div id="toasts"></div>
<div class="modal" id="menu"><div class="mbox">
 <h3>Opciones</h3>
 <button class="mi" data-a="xlsx">Exportar unidades a Excel</button>
 <button class="mi" data-a="json">Exportar datos (JSON)</button>
 <button class="mi" data-a="imp">Importar datos (JSON)</button>
 <button class="mi" data-a="print">Imprimir / guardar ficha</button>
 <button class="mi" data-a="admin">Modo administrador</button>
 <button class="mi" data-a="sheet">Conectar planilla en vivo</button>
 <button class="mi" data-a="demo">Restaurar datos demo</button>
 <button class="mi" data-a="clear" style="color:var(--no)">Limpiar y empezar de cero</button>
 <button class="btn g" style="margin-top:10px" data-a="close">Cerrar</button>
 <input type="file" id="fileIn" accept=".json" hidden>
</div></div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js" defer></script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ======================= CONFIG (editar acá) =======================
const CONFIG = {
  producto:   "Showroom 3D",
  marca:      "Acme Desarrollos",          // el comprador cambia esto
  logoTexto:  "AD",                        // iniciales o URL de imagen
  colorAcento:"#3B82F6",
  moneda:     "USD",                       // PYG | USD | EUR
  locale:     "es-PY",
  version:    "1.0.0",
  proyecto: { nombre: "Torre Aurora", ubicacion: "Barrio Norte · Asunción", entrega: "Diciembre 2028",
    descripcion: "Torre residencial de 14 pisos con amenities en la azotea: piscina, quincho y gimnasio. Departamentos de 1, 2 y 3 dormitorios.",
    amenities: ["Piscina en azotea","Quincho con parrilla","Gimnasio","Cowork","Cocheras","Seguridad 24 h"] },
  whatsapp:   "595900000000",              // número de ventas (con código de país, sin +)
  admin:      true,                        // false = versión estática (plan básico)
  pin:        "1234",                      // PIN del modo administrador
  edificio: { pisos: 14, pisoInicial: 1, precioM2: 1650, incrementoPiso: 0.012, extraEsquina: 0.04,
    tipologias: {
      A: { tipo: "2 dormitorios", dorm: 2, banos: 2, m2: 78,  balcon: 9,  orient: "Norte" },
      B: { tipo: "1 dormitorio",  dorm: 1, banos: 1, m2: 52,  balcon: 6,  orient: "Norte" },
      C: { tipo: "3 dormitorios", dorm: 3, banos: 2, m2: 112, balcon: 14, orient: "Sur" },
      D: { tipo: "2 dormitorios", dorm: 2, banos: 2, m2: 80,  balcon: 9,  orient: "Sur" } } },
  cotizador: { anticipo: 30, cuotasPct: 40, cuotas: 30, tasaAnual: 9, anios: 15 },
  planilla:  { url: "", cadaSeg: 60 }      // CSV publicado de Google Sheets: unidad,estado,precio
};
// ===================================================================

const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const KEY = 'showroom.' + CONFIG.proyecto.nombre.toLowerCase().replace(/[^a-z0-9]+/g, '-');
const fm = new Intl.NumberFormat(CONFIG.locale, { maximumFractionDigits: 0 });
const money = v => (CONFIG.moneda === 'PYG' ? 'Gs. ' : CONFIG.moneda === 'EUR' ? '€ ' : 'USD ') + fm.format(Math.round(v));
const COL = { disponible: 0x10B981, reservado: 0xF59E0B, vendido: 0x3A3F4A };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; $('#toasts').appendChild(t); setTimeout(() => t.remove(), 2400); }

// ---------- Branding ----------
document.documentElement.style.setProperty('--ac', CONFIG.colorAcento);
document.title = `${CONFIG.proyecto.nombre} · ${CONFIG.producto}`;
$('#logo').innerHTML = /^https?:|^data:/.test(CONFIG.logoTexto) ? `<img src="${CONFIG.logoTexto}" alt="">` : esc(CONFIG.logoTexto);
$('#pName').textContent = CONFIG.proyecto.nombre;
$('#pSub').textContent = `${CONFIG.marca} · ${CONFIG.proyecto.ubicacion}`;

// ---------- Datos ----------
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
function demoData() {
  const E = CONFIG.edificio, r = rng(7), U = [];
  for (let p = E.pisoInicial; p < E.pisoInicial + E.pisos; p++) {
    Object.entries(E.tipologias).forEach(([L, t]) => {
      const esquina = L === 'A' || L === 'D' || L === 'C';
      const pm2 = E.precioM2 * (1 + E.incrementoPiso * (p - E.pisoInicial)) * (esquina ? 1 + E.extraEsquina : 1);
      const precio = Math.round((t.m2 + t.balcon * 0.5) * pm2 / 100) * 100;
      const x = r(), alto = (p - E.pisoInicial) / E.pisos;
      const estado = x < 0.32 + alto * 0.25 ? 'vendido' : x < 0.46 + alto * 0.2 ? 'reservado' : 'disponible';
      U.push({ id: `${p}${String(['A','B','C','D'].indexOf(L) + 1).padStart(2,'0')}`, piso: p, letra: L, ...t, precio, estado });
    });
  }
  return { unidades: U, actualizado: new Date().toISOString() };
}
let DB;
try { DB = JSON.parse(localStorage.getItem(KEY)) } catch (e) { DB = null }
if (!DB || !Array.isArray(DB.unidades)) DB = demoData();
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(DB)) } catch (e) {} };
const UI = { sel: null, f: { dorm: 0, estado: 'todos' }, sort: { k: 'id', d: 1 }, admin: false, night: false };
const visible = u => (UI.f.dorm === 0 || u.dorm === UI.f.dorm) && (UI.f.estado === 'todos' || u.estado === UI.f.estado);

// ---------- KPIs ----------
function kpis() {
  const U = DB.unidades, n = U.length, disp = U.filter(u => u.estado === 'disponible'), vend = U.filter(u => u.estado === 'vendido');
  const m2d = disp.reduce((a, u) => a + u.m2, 0), vald = disp.reduce((a, u) => a + u.precio, 0);
  $('#kpis').innerHTML = [
    ['Disponibles', `${disp.length} / ${n}`],
    ['Vendido', `${Math.round(vend.length / n * 100)}%`],
    ['Precio prom. m²', m2d ? money(vald / m2d) : '—'],
    ['Stock disponible', money(vald)]
  ].map(([a, b]) => `<div class="kpi"><small>${a}</small><b class="num">${b}</b></div>`).join('');
}

// ---------- Escena 3D ----------
const canvas = $('#c3d'), stage = $('#stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.5, 900);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.49; controls.minDistance = 22; controls.maxDistance = 190;
controls.autoRotate = true; controls.autoRotateSpeed = 0.45;
const hemi = new THREE.HemisphereLight(0xdbe8ff, 0x2a2f3a, 1.1); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(40, 70, 30); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -50, right: 50, top: 70, bottom: -10, far: 200 }); scene.add(sun);

const FH = 3.1, W = 22, Dp = 14; // altura de piso, ancho, profundidad
const unitMesh = new Map(); const pickables = [];
function box(w, h, d, mat, x, y, z) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; scene.add(m); return m; }
const matSlab = new THREE.MeshStandardMaterial({ color: 0xE9E6E0, roughness: .8 });
const matCore = new THREE.MeshStandardMaterial({ color: 0xBDB8AE, roughness: .9 });
const matDark = new THREE.MeshStandardMaterial({ color: 0x2A2F3A, roughness: .9 });
const matGround = new THREE.MeshStandardMaterial({ color: 0x3B4250, roughness: 1 });
const matGrass = new THREE.MeshStandardMaterial({ color: 0x4F7A4A, roughness: 1 });

function construirEdificio() {
  const E = CONFIG.edificio, pisos = E.pisos;
  const g = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), matGround); g.rotation.x = -Math.PI / 2; g.receiveShadow = true; scene.add(g);
  box(60, .3, 46, matGrass, 0, .15, 0);
  box(W + 6, .5, Dp + 6, matSlab, 0, .4, 0);
  // planta baja (lobby)
  box(W, FH * 1.3, Dp, new THREE.MeshStandardMaterial({ color: 0x1F2937, roughness: .3, metalness: .4 }), 0, .65 + FH * .65, 0);
  const base = .65 + FH * 1.3;
  // núcleo
  box(4, pisos * FH + 4, 4, matCore, 0, base + (pisos * FH + 4) / 2, 0);
  // unidades: A (NO), B (NE), C (SE), D (SO) — 2 al frente (z+) y 2 al fondo (z-)
  const slots = { A: [-W / 4, Dp / 4], B: [W / 4, Dp / 4], C: [W / 4, -Dp / 4], D: [-W / 4, -Dp / 4] };
  DB.unidades.forEach(u => {
    const i = u.piso - E.pisoInicial, y = base + i * FH + FH / 2, [x, z] = slots[u.letra] || [0, 0];
    const mat = new THREE.MeshStandardMaterial({ color: COL[u.estado], roughness: .15, metalness: .3, transparent: true, opacity: .92, emissive: COL[u.estado], emissiveIntensity: .15 });
    const m = box(W / 2 - .5, FH - .55, Dp / 2 - .5, mat, x, y, z); m.userData.u = u; unitMesh.set(u.id, m); pickables.push(m);
  });
  for (let i = 0; i <= pisos; i++) { box(W + .8, .32, Dp + .8, matSlab, 0, base + i * FH, 0); }
  // balcones al frente
  for (let i = 0; i < pisos; i++) { const y = base + i * FH + .25; box(W - 1, .18, 1.6, matSlab, 0, y, Dp / 2 + .8); box(W - 1, .9, .06, new THREE.MeshStandardMaterial({ color: 0x9fd3ff, transparent: true, opacity: .35 }), 0, y + .5, Dp / 2 + 1.55); }
  // azotea: piscina + pérgola
  const top = base + pisos * FH;
  box(W + .8, .5, Dp + .8, matSlab, 0, top + .25, 0);
  box(9, .3, 4.5, matWater, -4, top + .6, 2.5);
  for (let k = 0; k < 5; k++) box(.25, .2, 5, matDark, 4 + k * 1.4, top + 3, -2);
  [[3.6, -4.2], [9.4, -4.2], [3.6, .2], [9.4, .2]].forEach(([x, z]) => box(.25, 2.6, .25, matDark, x, top + 1.8, z));
  // entorno: edificios vecinos y árboles
  const r = rng(3);
  for (let k = 0; k < 16; k++) {
    const a = k / 16 * Math.PI * 2, R = 115 + r() * 45, h = 8 + r() * 30;
    box(10 + r() * 10, h, 10 + r() * 10, new THREE.MeshStandardMaterial({ color: 0x4A5263, roughness: 1 }), Math.cos(a) * R, h / 2, Math.sin(a) * R);
  }
  const trunk = new THREE.MeshStandardMaterial({ color: 0x6b4f3a }), leaf = new THREE.MeshStandardMaterial({ color: 0x3f7a43, roughness: 1 });
  for (let k = 0; k < 14; k++) {
    const a = k / 14 * Math.PI * 2, R = 20 + (k % 2) * 4, x = Math.cos(a) * R * 1.2, z = Math.sin(a) * R;
    box(.4, 2.4, .4, trunk, x, 1.4, z);
    const s = new THREE.Mesh(new THREE.SphereGeometry(1.6 + r(), 12, 10), leaf); s.position.set(x, 3.6, z); s.castShadow = true; scene.add(s);
  }
  return base + pisos * FH;
}
const H = construirEdificio();
const narrow = () => Math.min(1, camera.aspect * 1.3);
const HOME = { pos: new THREE.Vector3(56, H * 0.85, 66), tgt: new THREE.Vector3(0, H * 0.5, 0) };
function homePos() { const k = 1 / Math.pow(narrow(), .85); return { pos: HOME.tgt.clone().add(HOME.pos.clone().sub(HOME.tgt).multiplyScalar(k)), tgt: HOME.tgt.clone() }; }

function setNight(n) {

  scene.fog = new THREE.Fog(scene.background, 120, 320);
  hemi.intensity = n ? .35 : 1.1; sun.intensity = n ? .25 : 2.2; sun.color.set(n ? 0x8aa4ff : 0xffffff);

function pintar() {
  DB.unidades.forEach(u => {
    const m = unitMesh.get(u.id); if (!m) return;
    const on = visible(u), sel = UI.sel === u.id;
    m.material.color.setHex(COL[u.estado]); m.material.emissive.setHex(sel ? 0xffffff : COL[u.estado]);
    m.material.emissiveIntensity = sel ? .55 : UI.night ? (u.estado === 'vendido' ? .25 : .75) : .15;

// ---------- Interacción ----------
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(); let hover = null, downAt = null;
function pick(e) {
  const r = canvas.getBoundingClientRect(); ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera); const hit = ray.intersectObjects(pickables)[0];
  return hit && visible(hit.object.userData.u) ? hit.object.userData.u : null;
}
canvas.addEventListener('pointermove', e => {
  const u = pick(e), tip = $('#tip');
  if (u !== hover) { hover = u; canvas.style.cursor = u ? 'pointer' : 'grab'; }
  if (u && e.pointerType === 'mouse') { const r = stage.getBoundingClientRect(); tip.style.left = (e.clientX - r.left + 14) + 'px'; tip.style.top = (e.clientY - r.top + 14) + 'px'; tip.innerHTML = `<b>Depto ${u.id}</b> · ${u.tipo}<br><span style="color:var(--mu)">${u.m2} m² · ${money(u.precio)} · ${u.estado}</span>`; tip.style.opacity = 1; }
  else tip.style.opacity = 0;
});
canvas.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; controls.autoRotate = false; });
canvas.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;
  const u = pick(e); if (u) seleccionar(u.id, true);
});
let tween = null;
function volar(pos, tgt, ms = 900) { tween = { p0: camera.position.clone(), t0: controls.target.clone(), p1: pos, t1: tgt, s: performance.now(), ms }; }
function seleccionar(id, fly) {
  UI.sel = id; pintar(); renderUnidad(); tabTo('pU');
  if (innerWidth <= 860) $('#side').classList.remove('min');
  const m = unitMesh.get(id); if (fly && m) { const p = m.position; const dir = new THREE.Vector3(p.x, 0, p.z).normalize(); const d = 58 / narrow(), mob = innerWidth <= 860; volar(new THREE.Vector3(p.x + dir.x * d + dir.z * d * .3, p.y + 10, p.z + dir.z * d - dir.x * d * .3), new THREE.Vector3(p.x * .3, p.y - (mob ? d * .18 : 0), p.z * .3)); }
}
$('#vHome').onclick = () => { const h = homePos(); volar(h.pos, h.tgt); controls.autoRotate = true; };
$('#vNight').onclick = () => setNight(!UI.night);

function resize() { const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); new ResizeObserver(resize).observe(stage);
function loop(now) {
  if (tween) { const k = Math.min(1, (now - tween.s) / tween.ms), e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    camera.position.lerpVectors(tween.p0, tween.p1, e); controls.target.lerpVectors(tween.t0, tween.t1, e); if (k >= 1) tween = null; }
  controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop);
}

    2: [['Living / comedor', 0, 0, 58, 50], ['Cocina', 58, 0, 42, 28], ['Baño', 58, 28, 20, 22], ['Baño', 78, 28, 22, 22], ['Dorm. principal', 0, 50, 55, 50], ['Dormitorio', 55, 50, 45, 50]],

  const S = 3.2, ox = 8, oy = 8;

   ${rooms.map(([n, x, y, w, h]) => `<rect x="${ox + x * S}" y="${oy + y * S}" width="${w * S}" height="${h * S}" fill="${/Baño|Cocina/.test(n) ? '#E6EEF5' : '#fff'}" stroke="#333" stroke-width="3"/><text x="${ox + (x + w / 2) * S}" y="${oy + (y + h / 2) * S + 4}" text-anchor="middle" font-size="13" fill="#333" font-weight="600">${n}</text>`).join('')}

function pmt(i, n, pv) { return i === 0 ? pv / n : pv * i / (1 - Math.pow(1 + i, -n)); }
function cotizar(u) {
  const c = UI.cot || (UI.cot = { ...CONFIG.cotizador });
  const P = u.precio, ant = P * c.anticipo / 100, cuo = P * c.cuotasPct / 100, cuota = c.cuotas > 0 ? cuo / c.cuotas : 0, saldo = P - ant - cuo;
  const fin = pmt(c.tasaAnual / 100 / 12, c.anios * 12, Math.max(0, saldo));
  return { P, ant, cuo, cuota, saldo, fin, c };
}

  if (a === 'imp') $('#fileIn').click();
  if (a === 'print') { tabTo('pU'); setTimeout(() => print(), 100); }
  if (a === 'admin') { if (!CONFIG.admin) return toast('El modo administrador no está habilitado');
    if (UI.admin) { UI.admin = false; document.body.classList.remove('admin'); return toast('Modo administrador desactivado'); }
    const p = prompt('PIN de administrador'); if (p === CONFIG.pin) { UI.admin = true; document.body.classList.add('admin'); toast('Modo administrador: tocá una unidad para editarla'); } else if (p !== null) toast('PIN incorrecto'); }
  if (a === 'sheet') { const u = prompt('Pegá el link CSV publicado de Google Sheets (columnas: unidad, estado, precio)', CONFIG.planilla.url || ''); if (u) { CONFIG.planilla.url = u.trim(); try { localStorage.setItem(KEY + '.sheet', u.trim()) } catch (e) {} sync(); } }
  if (a === 'demo') { DB = demoData(); save(); toast('Datos demo restaurados'); setTimeout(() => location.reload(), 500); }
  if (a === 'clear') { if (confirm('Se borran los cambios guardados en este dispositivo. ¿Seguir?')) { localStorage.removeItem(KEY); localStorage.removeItem(KEY + '.sheet'); toast('Listo, empezando de cero'); setTimeout(() => location.reload(), 500); } }
});
function pdfCot(u) {
  if (!window.jspdf) return toast('Cargando PDF, probá en un segundo');
  const { jsPDF } = window.jspdf, doc = new jsPDF(), q = cotizar(u);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(18); doc.text(`${CONFIG.proyecto.nombre} · Depto ${u.id}`, 14, 20);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.text(`${CONFIG.marca} · ${CONFIG.proyecto.ubicacion} · ${new Date().toLocaleDateString(CONFIG.locale)}`, 14, 27);
  doc.autoTable({ startY: 34, theme: 'grid', head: [['Unidad', 'Detalle']], body: [['Tipología', u.tipo], ['Piso', String(u.piso)], ['Superficie', `${u.m2} m² + balcón ${u.balcon} m²`], ['Orientación', u.orient], ['Precio', money(u.precio)], ['Estado', u.estado]] });
  doc.autoTable({ startY: doc.lastAutoTable.finalY + 6, theme: 'grid', head: [['Forma de pago', 'Monto']], body: [[`Anticipo (${q.c.anticipo}%)`, money(q.ant)], [`${q.c.cuotas} cuotas de obra (${q.c.cuotasPct}%)`, `${money(q.cuota)} / mes`], ['Saldo a la entrega', money(Math.max(0, q.saldo))], [`Financiación del saldo (${q.c.tasaAnual}% anual, ${q.c.anios} años)`, `${money(q.fin)} / mes`]] });
  doc.setFontSize(8); doc.text('Cotización orientativa, sujeta a disponibilidad y aprobación. No constituye oferta vinculante.', 14, doc.lastAutoTable.finalY + 8);
  doc.save(`cotizacion-${u.id}.pdf`); toast('Cotización descargada');
}

// ---------- Planilla en vivo ----------
function parseCSV(t) {
  const L = t.trim().split(/\r?\n/).map(l => l.split(',').map(x => x.trim().replace(/^"|"$/g, '')));
  const h = L.shift().map(x => x.toLowerCase()), iu = h.indexOf('unidad'), ie = h.indexOf('estado'), ip = h.indexOf('precio');
  if (iu < 0) throw new Error('Falta la columna "unidad"');
  return L.map(r => ({ id: r[iu], estado: (r[ie] || '').toLowerCase(), precio: parseFloat((r[ip] || '').replace(/[^\d.]/g, '')) }));
}
async function sync() {
  const url = CONFIG.planilla.url || (() => { try { return localStorage.getItem(KEY + '.sheet') } catch (e) { return '' } })();
  if (!url) return;
  try {
    const rows = parseCSV(await (await fetch(url, { cache: 'no-store' })).text()); let n = 0;
    rows.forEach(r => { const u = DB.unidades.find(x => x.id === r.id); if (!u) return;
      if (['disponible', 'reservado', 'vendido'].includes(r.estado) && u.estado !== r.estado) { u.estado = r.estado; n++; }
      if (r.precio > 0 && u.precio !== r.precio) { u.precio = r.precio; n++; } });
    $('#live').style.display = 'flex'; if (n) { save(); refrescar(); toast(`Planilla: ${n} cambios aplicados`); }
  } catch (e) { $('#live').style.display = 'none'; toast('No se pudo leer la planilla'); }
}

// ---------- Arranque ----------
setNight(false); refrescar(); resize(); { const h = homePos(); camera.position.copy(h.pos); controls.target.copy(h.tgt); } requestAnimationFrame(loop);
setTimeout(() => { $('#loading').style.opacity = 0; setTimeout(() => $('#loading').remove(), 400); }, 300);
if (innerWidth <= 860) $('#side').classList.add('min');
sync(); setInterval(sync, Math.max(15, CONFIG.planilla.cadaSeg) * 1000);
window.__showroom = { DB, seleccionar, setNight, cotizar, pmt };
</script>
