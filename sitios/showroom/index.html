<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0D12">
<title>Showroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!--
CONTEXTO
========
Showroom inmobiliario white-label. Un HTML + carpeta img/ (renders). Sin build.

Recorrido (3 niveles, como un showroom de sala de ventas):
 1) TORRE: render exterior a pantalla completa. Cada piso es un polígono SVG calibrado sobre el render
    (CONFIG.torre: coordenadas de las losas en píxeles de la imagen original). Hover/tap = resalta el piso.
 2) PLANTA: render isométrico del piso tipo con los departamentos marcados por estado (CONFIG.planta.unidades).
    Tocar un departamento abre la ficha: precio, superficies, ambientes, simulador de pago, WhatsApp, PDF.
 3) AMBIENTES: renders panorámicos que se recorren arrastrando (CONFIG.ambientes / CONFIG.amenities).

Datos: DB.unidades [{id,piso,letra,tipo,dorm,banos,m2,balcon,orient,precio,estado}] en localStorage.
Planilla en vivo (plan "en tiempo real"): CSV publicado de Google Sheets con columnas unidad,estado,precio,
 polling cada CONFIG.planilla.cadaSeg. Modo administrador con PIN para editar estado/precio.

Cotizador (auditable):
 Anticipo = P × a% · Cuotas de obra (sin interés) = P × c% / N · Saldo = P − anticipo − cuotas
 Financiación del saldo (sistema francés): PMT = S·i / (1 − (1+i)^−n), i = tasa/12, n = años×12

Proyecto nuevo: reemplazar img/*.jpg por los renders del cliente, recalibrar CONFIG.torre
(y de cada losa en la esquina y en el borde derecho) y CONFIG.planta.unidades (rectángulos y pines).
-->
<style>
:root{--ac:#C8A97E;--bg:#0B0D12;--glass:rgba(14,16,22,.62);--bd:rgba(255,255,255,.12);--tx:#F4F1EC;--mu:rgba(244,241,236,.62);--ok:#10B981;--wa:#F59E0B;--no:#EF4444}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:"Plus Jakarta Sans",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.num{font-variant-numeric:tabular-nums}
button,a{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;text-decoration:none}
input,select{font-family:inherit;font-size:14px;color:var(--tx);background:rgba(0,0,0,.35);border:1px solid var(--bd);border-radius:10px;padding:9px 10px;width:100%;outline:none;transition:border-color .15s}
input:focus,select:focus{border-color:var(--ac)}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);border:1px solid var(--bd);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.view{position:fixed;inset:0;opacity:0;pointer-events:none;transition:opacity .5s ease}
.view.on{opacity:1;pointer-events:auto}
#top{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:18px 22px;pointer-events:none}
#top>*{pointer-events:auto}
.brand{position:absolute;left:50%;transform:translateX(-50%);text-align:center;letter-spacing:.42em;font-weight:700;font-size:15px;text-transform:uppercase;text-shadow:0 2px 14px rgba(0,0,0,.5);white-space:nowrap}
.brand small{display:block;font-size:9px;letter-spacing:.38em;font-weight:500;color:var(--mu);margin-top:3px}
.tbtn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;transition:background .2s,transform .1s}
.tbtn:active{transform:scale(.97)}
.tbtn.g{background:var(--glass);border:1px solid var(--bd);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tbtn.g:hover{background:rgba(30,32,40,.8)}
.tbtn.p{background:var(--ac);color:#17130D}
.tbtn.p:hover{filter:brightness(1.08)}
.icon{width:16px;height:16px;flex-shrink:0}
#vTorre svg{position:absolute;inset:0;width:100%;height:100%}
#extImg{transform-origin:50% 50%;transform-box:fill-box;animation:kb 28s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.04)}}
.fl{fill:transparent;stroke:transparent;transition:fill .25s,stroke .25s;cursor:pointer}
.fl.hi{fill:rgba(200,169,126,.32);stroke:rgba(255,236,205,.95);stroke-width:3}
#heroCard{position:absolute;left:22px;bottom:22px;width:350px;padding:20px;z-index:5}
#heroCard h1{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
#heroCard p{color:var(--mu);font-size:13px;margin-top:6px;line-height:1.5}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.stat{background:rgba(0,0,0,.28);border:1px solid var(--bd);border-radius:12px;padding:10px}
.stat small{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.stat b{font-size:15px;font-weight:700;white-space:nowrap}
#floorList{position:absolute;right:22px;top:50%;transform:translateY(-50%);width:230px;padding:10px;z-index:5;max-height:calc(100% - 180px);overflow:auto}
#floorList h3{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);padding:8px 10px 10px;font-weight:600}
.frow{display:flex;align-items:center;justify-content:space-between;padding:9px 10px;border-radius:10px;font-size:13.5px;transition:background .15s;cursor:pointer}
.frow:hover,.frow.hi{background:rgba(255,255,255,.08)}
.dots{display:flex;gap:4px}.dots i{width:8px;height:8px;border-radius:50%}
#floorTip{position:absolute;z-index:6;pointer-events:none;padding:10px 14px;opacity:0;transition:opacity .15s;font-size:13px;white-space:nowrap}
#floorTip b{font-size:18px;display:block}
#hint{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);font-size:12.5px;color:var(--mu);padding:8px 14px;border-radius:999px;z-index:4;white-space:nowrap}
#vPlanta{background:#0B0D12}
#vPlanta .bgimg{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(28px) brightness(.35) saturate(1.2);transform:scale(1.05)}
#plantaWrap{position:absolute;left:0;right:430px;top:70px;bottom:20px;display:flex;align-items:center;justify-content:center;padding:20px}
#plantaSvg{width:100%;height:100%;-webkit-mask-image:radial-gradient(ellipse 58% 60% at 50% 50%,#000 78%,transparent 100%);mask-image:radial-gradient(ellipse 58% 60% at 50% 50%,#000 78%,transparent 100%)}
.ug{cursor:pointer}
.ulbl{pointer-events:none;transition:opacity .2s}
.pin{cursor:pointer}
.pin circle.o{animation:pp 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pp{from{opacity:.8;transform:scale(1)}to{opacity:0;transform:scale(2.4)}}
#floorStep{position:absolute;left:22px;top:84px;padding:14px 16px;z-index:5;display:flex;align-items:center;gap:14px}
#floorStep .big{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1}
#floorStep small{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mu)}
.stepb{display:flex;flex-direction:column;gap:6px}
.stepb button{width:34px;height:34px;border-radius:10px;border:1px solid var(--bd);background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;transition:background .15s}
.stepb button:hover{background:rgba(255,255,255,.1)}
.stepb button:disabled{opacity:.3;cursor:default}
#side{position:absolute;right:16px;top:76px;bottom:16px;width:400px;z-index:6;display:flex;flex-direction:column;overflow:hidden}
#sideBody{flex:1;overflow:auto;padding:18px}
.legend{display:flex;gap:12px;font-size:12px;color:var(--mu);margin-bottom:12px}
.legend span{display:flex;align-items:center;gap:6px}.legend i{width:9px;height:9px;border-radius:50%}
.ucard{display:flex;align-items:center;justify-content:space-between;padding:12px;border-radius:14px;border:1px solid var(--bd);background:rgba(0,0,0,.22);margin-bottom:8px;cursor:pointer;transition:border-color .15s,background .15s}
.ucard:hover{border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.05)}
.ucard b{font-size:15px}.ucard small{display:block;color:var(--mu);font-size:12px;margin-top:2px}
.st{font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap;text-transform:capitalize}
.st.disponible{background:rgba(16,185,129,.16);color:#34D399}.st.reservado{background:rgba(245,158,11,.16);color:#FBBF24}.st.vendido{background:rgba(239,68,68,.14);color:#F87171}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dh h2{font-size:26px;font-weight:800;letter-spacing:-.02em}.dh p{color:var(--mu);font-size:13px;margin-top:3px}
.price{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-top:14px}.price small{font-size:12px;color:var(--mu);font-weight:500;margin-left:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.cell{background:rgba(0,0,0,.25);border:1px solid var(--bd);border-radius:12px;padding:10px}
.cell small{display:block;font-size:11px;color:var(--mu)}.cell b{font-size:15px}
.sec{font-size:11px;font-weight:700;color:var(--mu);letter-spacing:.12em;text-transform:uppercase;margin:20px 0 10px;display:flex;align-items:center;gap:6px}
.amb{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.amb button{position:relative;height:84px;border-radius:12px;overflow:hidden;border:1px solid var(--bd);background-size:cover;background-position:center;transition:transform .15s}
.amb button:hover{transform:scale(1.02)}
.amb button::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,rgba(0,0,0,.6))}
.amb button span{position:absolute;left:8px;bottom:7px;font-size:12px;font-weight:700;z-index:1}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:13.5px;border-bottom:1px dashed var(--bd)}
.row:last-child{border:0}.row span{color:var(--mu)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.f2 label{font-size:11.5px;color:var(--mu);display:block;margin-bottom:4px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border-radius:12px;font-weight:700;font-size:14px;transition:filter .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn.p{background:var(--ac);color:#17130D}.btn.p:hover{filter:brightness(1.08)}
.btn.g{background:rgba(255,255,255,.06);border:1px solid var(--bd)}.btn.g:hover{background:rgba(255,255,255,.1)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.back{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mu);margin-bottom:12px}
.back:hover{color:var(--tx)}
.tip-i{display:inline-flex;width:15px;height:15px;border-radius:50%;border:1px solid var(--mu);font-size:10px;align-items:center;justify-content:center;color:var(--mu);cursor:help;position:relative;text-transform:none;letter-spacing:0}
.tip-i:hover::after{content:attr(data-t);position:absolute;bottom:130%;left:50%;transform:translateX(-50%);width:230px;background:#0B0D12;border:1px solid var(--bd);padding:8px 10px;border-radius:8px;font-size:12px;color:var(--tx);font-weight:500;line-height:1.4;z-index:20}
#vAmb{background:#000;cursor:grab;touch-action:none;overflow:hidden}
#vAmb.drag{cursor:grabbing}
#pano{position:absolute;top:0;left:0;height:100%;width:auto;max-width:none;user-select:none;-webkit-user-drag:none;will-change:transform}
#ambLbl{position:absolute;left:22px;bottom:118px;padding:12px 16px;z-index:5}
#ambLbl small{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mu)}
#ambLbl b{font-size:20px}
#ambThumbs{position:absolute;left:50%;transform:translateX(-50%);bottom:20px;display:flex;gap:8px;padding:8px;z-index:5;max-width:calc(100% - 32px);overflow-x:auto}
#ambThumbs button{width:110px;height:62px;border-radius:10px;background-size:cover;background-position:center;border:2px solid transparent;flex-shrink:0;position:relative;opacity:.75;transition:opacity .15s,border-color .15s}
#ambThumbs button.on{border-color:var(--ac);opacity:1}
#ambThumbs button:hover{opacity:1}
#ambThumbs button span{position:absolute;left:6px;bottom:4px;font-size:10.5px;font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.9)}
#dragHint{position:absolute;right:22px;bottom:128px;font-size:12px;color:var(--mu);padding:8px 12px;border-radius:999px;z-index:5}
#tx{position:fixed;inset:0;z-index:25;background:#000;opacity:0;pointer-events:none;transition:opacity .35s}
#tx.on{opacity:1}
#tx video{width:100%;height:100%;object-fit:cover;display:block}
.view.zoomout{transition:transform .8s cubic-bezier(.6,0,.3,1),opacity .8s;opacity:0!important}
.view.zoomin{transform:scale(1.08);opacity:0}
#toasts{position:fixed;top:76px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{padding:10px 14px;border-radius:12px;font-size:13px;font-weight:600;animation:ti .2s ease-out}
@keyframes ti{from{opacity:0;transform:translateY(-6px)}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.mbox{width:100%;max-width:420px;max-height:90vh;overflow:auto;padding:18px}
.mbox h3{font-size:17px;margin-bottom:12px}
.mi{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;font-size:14px;font-weight:600;width:100%;text-align:left;transition:background .12s}
.mi:hover{background:rgba(255,255,255,.07)}
#loader{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .6s}
#loader .brand{position:static;transform:none}
#loader .bar{width:180px;height:2px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
#loader .bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
.adm{display:none}.admin .adm{display:block}
@media (max-width:860px){
 #top{padding:12px}
 .brand{font-size:11px;letter-spacing:.28em}.brand small{display:none}
 #bAmen{display:none}
 #floorTip{display:none}
 .tbtn .lbl{display:none}.tbtn{padding:10px 12px}
 #heroCard{left:12px;right:12px;bottom:12px;width:auto;padding:14px}
 #heroCard h1{font-size:22px}#heroCard p{display:none}
 .stats{margin-top:10px}
 #floorList{display:none}
 #hint{bottom:auto;top:64px;font-size:11.5px}
 #plantaWrap{right:0;top:116px;bottom:auto;height:38%;padding:6px}
 #floorStep{top:62px;left:12px;padding:6px 12px}#floorStep .big{font-size:26px}
 .stepb{flex-direction:row}
 #side{left:0;right:0;bottom:0;top:auto;width:auto;height:52%;border-radius:20px 20px 0 0}
 #ambLbl{bottom:96px;left:12px}#dragHint{display:none}
 #ambThumbs button{width:84px;height:50px}
}
@media print{
 #top,#vTorre,#vAmb,#plantaWrap,#floorStep,.bgimg,.no-print{display:none!important}
 html,body{overflow:visible;background:#fff;color:#111}
 #vPlanta{position:static;opacity:1}
 #side{position:static;width:auto;border:0;box-shadow:none;background:#fff;color:#111}
}
</style>
</head>
<body>
<div id="loader"><div class="brand" id="ldBrand"></div><div class="bar"><i id="ldBar"></i></div></div>

<header id="top">
 <button class="tbtn g" id="bBack" style="visibility:hidden"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg><span class="lbl" id="bBackLbl">Volver</span></button>
 <div class="brand" id="brand"></div>
 <div style="display:flex;gap:8px">
  <button class="tbtn g" id="bAmen"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 20h18M5 20V9l7-5 7 5v11"/></svg><span class="lbl">Amenities</span></button>
  <a class="tbtn p" id="bInteres" target="_blank" rel="noopener"><span class="lbl">Registrar interés</span><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
  <button class="tbtn g" id="bMenu" aria-label="Menú"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
 </div>
</header>

<section class="view on" id="vTorre">
 <svg id="torreSvg" viewBox="0 0 2688 1520" preserveAspectRatio="xMidYMid slice"><rect x="0" y="-600" width="2688" height="620" fill="#1B2A5C"/><rect x="0" y="1500" width="2688" height="600" fill="#0B0D12"/><image id="extImg" href="img/exterior.jpg" x="0" y="0" width="2688" height="1520"/><g id="floors"></g></svg>
 <div class="glass" id="heroCard"></div>
 <div class="glass" id="floorList"></div>
 <div class="glass" id="floorTip"></div>
 <div class="glass" id="hint">Tocá un piso para ver los departamentos</div>
</section>

<section class="view" id="vPlanta">
 <div class="bgimg" style="background-image:url(img/exterior-t.jpg)"></div>
 <div class="glass" id="floorStep"><div class="stepb"><button id="fUp" aria-label="Piso de arriba"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 15l6-6 6 6"/></svg></button><button id="fDn" aria-label="Piso de abajo"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></button></div><div><small>Piso</small><div class="big num" id="fNum">07</div></div></div>
 <div id="plantaWrap"><svg id="plantaSvg" viewBox="0 0 2688 1520" preserveAspectRatio="xMidYMid meet"><image href="img/planta.jpg" width="2688" height="1520"/><g id="units"></g><g id="pins"></g></svg></div>
 <aside class="glass" id="side"><div id="sideBody"></div></aside>
</section>

<section class="view" id="vAmb">
 <img id="pano" alt="" draggable="false">
 <div class="glass" id="ambLbl"><small id="ambSub"></small><b id="ambName"></b></div>
 <div class="glass" id="dragHint">Arrastrá para mirar alrededor</div>
 <div class="glass" id="ambThumbs"></div>
</section>

<div id="tx"><video id="txv" muted playsinline preload="auto"></video></div>
<div id="toasts"></div>
<div class="modal" id="menu"><div class="mbox glass">
 <h3>Opciones</h3>
 <button class="mi" data-a="amen">Ver amenities</button>
 <button class="mi" data-a="xlsx">Exportar unidades a Excel</button>
 <button class="mi" data-a="json">Exportar datos (JSON)</button>
 <button class="mi" data-a="imp">Importar datos (JSON)</button>
 <button class="mi" data-a="admin">Modo administrador</button>
 <button class="mi" data-a="sheet">Conectar planilla en vivo</button>
 <button class="mi" data-a="demo">Restaurar datos demo</button>
 <button class="mi" data-a="clear" style="color:#F87171">Limpiar y empezar de cero</button>
 <button class="btn g" style="margin-top:10px" data-a="close">Cerrar</button>
 <input type="file" id="fileIn" accept=".json" hidden>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js" defer></script>
<script>
// ======================= CONFIG (editar acá) =======================
const CONFIG = {
  producto:   "Showroom",
  marca:      "Acme Desarrollos",           // el comprador cambia esto
  logoTexto:  "AURORA",                     // texto del logo central (o URL de imagen)
  colorAcento:"#C8A97E",
  moneda:     "USD",                        // PYG | USD | EUR
  locale:     "es-PY",
  version:    "2.0.0",
  proyecto: { nombre: "Torre Aurora", sub: "Residences", ubicacion: "Barrio Norte · Asunción", entrega: "Diciembre 2028",
    descripcion: "10 pisos de departamentos de 1, 2 y 3 dormitorios con balcones corridos, lobby de doble altura y azotea con piscina infinita." },
  whatsapp:   "595900000000",               // número de ventas con código de país, sin +
  admin:      true,                         // false = versión estática
  pin:        "1234",
  // Calibración del render exterior (px de la imagen original 2688×1520).
  // Losas k=0 (techo) a k=10 (sobre el lobby). yIzq: esquina (x=xC). yDer: borde derecho (x=xR).
  torre: { pisos: 10, xL: 985, xC: 1110, xR: 1745, yIzq0: 200, pasoIzq: 98, yDer0: 280, pasoDer: 89.5, lateral0: 72 },
  // Departamentos sobre el render de planta (px de 2688×1520): rectángulo [x,y,w,h] y pines de ambientes.
  planta: { unidades: {
    A: { rect: [190, 760, 990, 520], pins: { living: [860, 1060], cocina: [930, 840], suite: [420, 1060], bano: [610, 850] } },

  $('#bBackLbl').textContent = v === 'planta' ? 'Torre' : UI.ambModo === 'a' ? 'Volver' : 'Planta';
}
$('#bBack').onclick = () => { if (UI.view === 'planta') { setView('torre'); renderTorre(); } else setView(UI.ambModo === 'a' ? (UI.prevView || 'torre') : 'planta'); };
$('#bAmen').onclick = () => abrirAmb('a', 'a0');
addEventListener('keydown', e => { if (e.key === 'Escape' && UI.view !== 'torre') $('#bBack').click(); });
addEventListener('resize', () => { fitTorre(); if (UI.view === 'amb') abrirAmb(UI.ambModo, UI.amb); });

// ---------- menú ----------
const dl = (blob, name) => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); };
$('#bMenu').onclick = () => $('#menu').classList.add('on');
$('#menu').onclick = e => { if (e.target.id === 'menu') $('#menu').classList.remove('on'); };
$('#fileIn').onchange = async e => { try { const d = JSON.parse(await e.target.files[0].text()); if (!Array.isArray(d.unidades)) throw 0; DB = d; save(); toast('Datos importados'); refrescar(); } catch (x) { toast('El archivo no es válido'); } e.target.value = ''; };
$$('#menu [data-a]').forEach(b => b.onclick = () => {
  const a = b.dataset.a; $('#menu').classList.remove('on');
  if (a === 'xlsx') { if (!window.XLSX) return toast('Cargando Excel, probá en un segundo');
    const ws = XLSX.utils.json_to_sheet(DB.unidades.map(u => ({ Unidad: u.id, Piso: u.piso, Tipologia: u.tipo, Dormitorios: u.dorm, Banos: u.banos, m2: u.m2, Balcon_m2: u.balcon, Orientacion: u.orient, Precio: u.precio, Precio_m2: Math.round(u.precio / u.m2), Estado: u.estado })));
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Unidades'); XLSX.writeFile(wb, `${KEY}.xlsx`); toast('Excel descargado'); }
  if (a === 'amen') abrirAmb('a', 'a0');
  if (a === 'json') { dl(new Blob([JSON.stringify(DB, null, 1)], { type: 'application/json' }), `${KEY}.json`); toast('Datos exportados'); }
  if (a === 'imp') $('#fileIn').click();
  if (a === 'admin') { if (!CONFIG.admin) return toast('El modo administrador no está habilitado');
    if (UI.admin) { UI.admin = false; document.body.classList.remove('admin'); return toast('Modo administrador desactivado'); }
    const p = prompt('PIN de administrador'); if (p === CONFIG.pin) { UI.admin = true; document.body.classList.add('admin'); toast('Modo administrador activo'); } else if (p !== null) toast('PIN incorrecto'); }
  if (a === 'sheet') { const u = prompt('Link CSV publicado de Google Sheets (columnas: unidad, estado, precio)', CONFIG.planilla.url || ''); if (u) { CONFIG.planilla.url = u.trim(); try { localStorage.setItem(KEY + '.sheet', u.trim()) } catch (e) {} sync(); } }
  if (a === 'demo') { DB = demoData(); save(); toast('Datos demo restaurados'); refrescar(); }
  if (a === 'clear') { if (confirm('Se borran los cambios guardados en este dispositivo. ¿Seguir?')) { localStorage.removeItem(KEY); localStorage.removeItem(KEY + '.sheet'); DB = demoData(); toast('Listo, empezando de cero'); refrescar(); } }
});
function pdfCot(u) {
  if (!window.jspdf) return toast('Cargando PDF, probá en un segundo');
  const { jsPDF } = window.jspdf, doc = new jsPDF(), q = cotizar(u);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(18); doc.text(`${CONFIG.proyecto.nombre} · Depto ${u.id}`, 14, 20);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.text(`${CONFIG.marca} · ${CONFIG.proyecto.ubicacion} · ${new Date().toLocaleDateString(CONFIG.locale)}`, 14, 27);
  doc.autoTable({ startY: 34, theme: 'grid', head: [['Unidad', 'Detalle']], body: [['Tipología', u.tipo], ['Piso', String(u.piso)], ['Superficie', `${u.m2} m² + balcón ${u.balcon} m²`], ['Orientación', u.orient], ['Precio', money(u.precio)], ['Estado', u.estado]] });
  doc.autoTable({ startY: doc.lastAutoTable.finalY + 6, theme: 'grid', head: [['Forma de pago', 'Monto']], body: [[`Anticipo (${q.c.anticipo}%)`, money(q.ant)], [`${q.c.cuotas} cuotas de obra (${q.c.cuotasPct}%)`, `${money(q.cuota)} / mes`], ['Saldo a la entrega', money(Math.max(0, q.saldo))], [`Financiación del saldo (${q.c.tasaAnual}% anual, ${q.c.anios} años)`, `${money(q.fin)} / mes`]] });
  doc.setFontSize(8); doc.text('Cotización orientativa, sujeta a disponibilidad y aprobación. Imágenes ilustrativas. No constituye oferta vinculante.', 14, doc.lastAutoTable.finalY + 8);
  doc.save(`cotizacion-${u.id}.pdf`); toast('Cotización descargada');
}
function parseCSV(t) {
  const L = t.trim().split(/\r?\n/).map(l => l.split(',').map(x => x.trim().replace(/^"|"$/g, '')));
  const h = L.shift().map(x => x.toLowerCase()), iu = h.indexOf('unidad'), ie = h.indexOf('estado'), ip = h.indexOf('precio');
  if (iu < 0) throw new Error('Falta la columna unidad');
  return L.map(r => ({ id: r[iu], estado: (r[ie] || '').toLowerCase(), precio: parseFloat((r[ip] || '').replace(/[^\d.]/g, '')) }));
}
async function sync() {
  const url = CONFIG.planilla.url || (() => { try { return localStorage.getItem(KEY + '.sheet') } catch (e) { return '' } })(); if (!url) return;
  try { const rows = parseCSV(await (await fetch(url, { cache: 'no-store' })).text()); let n = 0;
    rows.forEach(r => { const u = DB.unidades.find(x => x.id === r.id); if (!u) return;
      if (['disponible', 'reservado', 'vendido'].includes(r.estado) && u.estado !== r.estado) { u.estado = r.estado; n++; }
      if (r.precio > 0 && u.precio !== r.precio) { u.precio = r.precio; n++; } });
    if (n) { save(); refrescar(); toast(`Planilla en vivo: ${n} cambios`); }
  } catch (e) { toast('No se pudo leer la planilla'); }
}
function refrescar() { renderTorre(); if (UI.view === 'planta') renderPlanta(); }

// ---------- arranque ----------
fitTorre(); renderTorre();
const pre = ['img/exterior.jpg', 'img/planta.jpg', 'img/exterior-t.jpg']; let ok = 0;
const hideLoader = () => { const l = $('#loader'); if (l) { l.style.opacity = 0; setTimeout(() => l.remove(), 600); } };
pre.forEach(s => { const i = new Image(); i.onload = i.onerror = () => { $('#ldBar').style.width = (++ok / pre.length * 100) + '%'; if (ok === pre.length) setTimeout(hideLoader, 250); }; i.src = s; });
setTimeout(hideLoader, 6000);
setTimeout(() => [...Object.values(CONFIG.ambientes), ...CONFIG.amenities].forEach(a => { const i = new Image(); i.src = a.img; }), 1500);
sync(); setInterval(sync, Math.max(15, CONFIG.planilla.cadaSeg) * 1000);
function entrarAmb(k, x, y) { transicion(`planta>${k}`, '#vPlanta', x, y, () => abrirAmb('u', k)); }
window.__sr = { entrarAmb, transicion, DB, irPiso, selUnidad, abrirAmb, cotizar, hiFloor, setView };
</script>
