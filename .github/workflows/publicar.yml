name: Robot publicador Instagram
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: publicar
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Publicar lo que toca
        run: python3 bot/publicar.py
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
      - name: Guardar estado
        run: |
          git config user.name "robot-publicador"
          git config user.email "robot-publicador@users.noreply.github.com"
          git add bot/estado.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "robot: publicado [CI Skip]" && git pull --rebase -q && git push -q)
